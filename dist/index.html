<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Infra 认知训练场</title>
<style>
:root {
  --bg: #0b0e13;
  --bg2: #11151c;
  --bg3: #161b23;
  --line: #222b36;
  --line2: #2f3a47;
  --txt: #e6edf3;
  --dim: #8b98a5;
  --dim2: #6b7885;
  --acc: #f0a020;
  --ok: #3fb950;
  --bad: #f85149;
  --warn: #d29922;
  --blue: #58a6ff;
  --purple: #bc8cff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  font: 14px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

.page { max-width: 1400px; margin: 0 auto; padding: 28px 26px 80px; }

/* ---------------- 地图页 ---------------- */

.hero h1 { font-size: 26px; font-weight: 500; margin: 10px 0 8px; letter-spacing: .5px; }
.hero p { color: var(--dim); margin: 0 0 14px; max-width: 760px; }
.hero-kpi { font-size: 12px; color: var(--dim2); }
.hero-kpi b { color: var(--acc); font-weight: 500; }

.map-note { margin: 26px 0 10px; font-size: 12px; color: var(--dim2); }

.map { display: flex; flex-direction: column; gap: 8px; }

.map-row {
  display: grid;
  grid-template-columns: 220px 1fr 140px;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: not-allowed;
  color: var(--dim2);
}
.map-row.live { cursor: pointer; color: var(--txt); border-color: #3a2f18; background: linear-gradient(90deg, #17120a, var(--bg2) 55%); }
.map-row.live:hover { border-color: var(--acc); }
.map-l { display: flex; align-items: baseline; gap: 10px; }
.map-l b { font: 12px/1 var(--mono); color: var(--dim2); }
.map-row.live .map-l b { color: var(--acc); }
.map-l span { font-size: 14px; }
.map-r { display: flex; align-items: baseline; gap: 12px; font-size: 12px; }
.map-r em { font-style: normal; color: var(--dim2); font-family: var(--mono); }
.map-n { text-align: right; font-size: 12px; }
.map-foot { margin-top: 18px; font-size: 12px; color: var(--dim2); }

/* ---------------- 平面页 ---------------- */

.crumb { font-size: 12px; color: var(--dim2); margin-bottom: 14px; }
.crumb a:hover { color: var(--acc); }
.ph { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
.ps { color: var(--dim); margin: 0 0 22px; font-size: 13px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); }
.card.live { cursor: pointer; }
.card.live:hover { border-color: var(--acc); background: var(--bg3); }
.card.soon { opacity: .45; }
.card-id { font: 11px/1 var(--mono); color: var(--dim2); margin-bottom: 8px; }
.card-t { font-size: 15px; margin-bottom: 8px; }
.card-atoms { display: flex; gap: 6px; margin-bottom: 10px; }
.card-f { font-size: 12px; color: var(--dim); line-height: 1.5; }
.card-go { margin-top: 12px; font-size: 12px; color: var(--acc); }
.card-go.dim { color: var(--dim2); }

.atom { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; border-radius: 4px; font: 10px/1 var(--mono); }
.a-A { background: rgba(88,166,255,.15); color: var(--blue); }
.a-C { background: rgba(240,160,32,.15); color: var(--acc); }
.a-B { background: rgba(248,81,73,.15); color: var(--bad); }
.a-D { background: rgba(188,140,255,.15); color: var(--purple); }

/* ---------------- 模块页 ---------------- */

.mod-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
.mod-id { font: 11px/1 var(--mono); color: var(--acc); margin-bottom: 6px; }
.mod-side { display: flex; align-items: center; gap: 12px; }
.switch { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; cursor: pointer; }

.stabs { display: flex; gap: 8px; margin: 16px 0 14px; flex-wrap: wrap; }
.stab {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 13px; border: 1px solid var(--line); border-radius: 20px;
  font-size: 13px; color: var(--dim); background: var(--bg2);
}
.stab:hover { border-color: var(--line2); color: var(--txt); }
.stab.on { border-color: var(--acc); color: var(--txt); background: rgba(240,160,32,.08); }

.work { display: grid; grid-template-columns: 400px minmax(0,1fr) 340px; gap: 14px; align-items: start; }
.panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }

input[type="checkbox"] { accent-color: var(--acc); width: 14px; height: 14px; }
input[type="radio"] { accent-color: var(--acc); }

.ttabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.ttab {
  background: none; border: 1px solid transparent; color: var(--dim2);
  font: 11px/1 var(--mono); padding: 5px 8px; border-radius: 5px; cursor: pointer;
}
.ttab:hover { color: var(--txt); }
.ttab.on { color: var(--acc); border-color: var(--line2); background: var(--bg3); }

.term {
  display: none; margin: 0; padding: 12px; background: #080b0f; border: 1px solid var(--line);
  border-radius: 8px; font: 11px/1.6 var(--mono); color: #b9c6d3;
  white-space: normal; overflow: auto; max-height: 470px; scrollbar-width: thin;
}
.term.on { display: block; }
.term::-webkit-scrollbar { height: 8px; width: 8px; }
.term::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
.tpre { margin: 0; white-space: pre; overflow-x: auto; font: inherit; color: inherit; }
.tleg { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); white-space: pre-wrap; font-size: 10.5px; line-height: 1.7; color: var(--dim2); }

.note { margin-top: 12px; font-size: 12px; line-height: 1.7; color: var(--dim); }
.note b { color: var(--txt); font-weight: 500; }
.note code { font-family: var(--mono); font-size: 11.5px; color: var(--acc); background: #0b0f14; padding: 1px 4px; border-radius: 3px; }

.bar { display: flex; gap: 8px; align-items: center; margin: 16px 0 0; flex-wrap: wrap; }
.seed { margin-left: auto; font: 11px/1 var(--mono); color: var(--dim2); }

.btn {
  padding: 8px 15px; border-radius: 7px; border: 1px solid var(--line2);
  background: var(--bg3); color: var(--txt); font-size: 13px; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--dim); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #1a1200; font-weight: 500; }
.btn.primary:hover { background: #ffb02e; }
.btn.ghost { background: none; color: var(--dim); }
.btn:disabled { opacity: .35; cursor: not-allowed; }

/* ---------------- 拼装区 ---------------- */

.bd { display: flex; gap: 12px; align-items: flex-start; }
.bd-numa {
  flex: 1 1 0; min-width: 240px;
  border: 1px solid var(--line2); border-radius: 10px; padding: 10px;
  background: #0e1218;
}
.bd-numa-h { font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; margin-bottom: 8px; }
.bd-numa-n { color: var(--dim2); }

.bd-part {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 10px; margin: 3px 4px 3px 0;
  border: 1px solid var(--line2); border-radius: 7px;
  background: var(--bg3); font: 12px/1.2 var(--mono); cursor: grab;
}
.bd-part:hover { border-color: var(--dim); }
.bd-part.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
.bd-id { color: var(--txt); }
.bd-meta { color: var(--dim2); font-size: 10px; }

.bd-zone {
  border: 1px dashed var(--line2); border-radius: 7px;
  padding: 8px; margin: 5px 0; font-size: 11px; color: var(--dim2); text-align: center;
}
.bd-zone.ok { border-color: var(--ok); color: var(--ok); background: rgba(63,185,80,.07); }
.bd-zone.over { border-color: var(--ok); background: rgba(63,185,80,.16); }

.bd-cols { display: flex; gap: 8px; flex-wrap: wrap; }
.bd-col { flex: 1 1 140px; border-left: 2px solid var(--line); padding-left: 8px; }
.bd-kids { display: flex; flex-wrap: wrap; gap: 4px; }
.bd-sw { width: 100%; border: 1px solid #3a2f18; border-radius: 7px; padding: 6px; margin: 4px 0; background: #14100a; }

.bd-msg { padding: 8px 12px; border-radius: 7px; font-size: 12px; margin-bottom: 10px; background: var(--bg3); color: var(--dim); }
.bd-msg.bad { color: var(--bad); background: rgba(248,81,73,.08); }

.bd-traybox { margin-top: 12px; border-top: 1px dashed var(--line2); padding-top: 10px; }
.bd-tray-h { font-size: 11px; color: var(--dim2); margin-bottom: 8px; }
.bd-tray { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; }
.bd-trayitem {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 9px; border: 1px solid var(--line2); border-radius: 6px;
  background: #0c1015; font: 12px/1.2 var(--mono); cursor: grab;
}
.bd-trayitem:hover { border-color: var(--dim); }
.bd-tl { font-size: 9px; color: var(--dim2); text-transform: uppercase; letter-spacing: .5px; }
.bd-empty { font-size: 12px; color: var(--dim2); }

/* 五类零件各有一条色条，扫一眼就分得开层级。
   写在最后并加复合选择器，才能盖过 .bd-part / .bd-trayitem 的边框简写。 */
.bd-part.bd-t-cpu, .bd-trayitem.bd-t-cpu { border-left: 3px solid var(--blue); background: #101a24; }
.bd-part.bd-t-bridge, .bd-trayitem.bd-t-bridge { border-left: 3px solid #b6862c; background: #1a1710; }
.bd-part.bd-t-switch, .bd-trayitem.bd-t-switch { border-left: 3px solid #6d5a2a; background: #1a1509; }
.bd-part.bd-t-gpu, .bd-trayitem.bd-t-gpu { border-left: 3px solid var(--ok); background: #0f1a13; }
.bd-part.bd-t-nic, .bd-trayitem.bd-t-nic { border-left: 3px solid var(--purple); background: #180f1c; }

/* ---------------- 矩阵 ---------------- */

.side-h { font-size: 13px; color: var(--txt); margin-bottom: 4px; }
.side-sub { font-size: 11px; color: var(--dim2); margin-bottom: 10px; }
.mx-wrap { overflow-x: auto; }
.mx { border-collapse: collapse; font: 11px/1 var(--mono); }
.mx th, .mx td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; white-space: nowrap; }
.mx thead th { color: var(--dim2); font-weight: 400; }
.mx-corner { width: 54px; border: none !important; }
.mx-row { color: var(--dim); font-weight: 400; text-align: left !important; border: none !important; padding-right: 8px !important; }
.mx-self { color: var(--dim2); background: #0e1218; }
.mx-unk { color: var(--dim2); }
.mx-near { color: var(--ok); }
.mx-mid { color: var(--warn); }
.mx-far { color: var(--bad); }
.mx-nv { color: var(--blue); }
.mx-compact th, .mx-compact td { padding: 3px 4px; font-size: 10px; }
.mx-note { margin-top: 10px; font-size: 11px; color: var(--dim2); line-height: 1.6; }

.kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.kv span { color: var(--dim); }
.kv b { font-family: var(--mono); font-weight: 400; color: var(--txt); }
.steps div { font-size: 12px; color: var(--dim); padding: 3px 0; }

/* ---------------- 计算 / 选择 ---------------- */

.calc { padding: 8px 0; }
.calc-row { display: block; margin-bottom: 14px; }
.calc-l { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.calc-in { display: flex; align-items: center; gap: 8px; }
.calc-i {
  width: 160px; padding: 10px 12px; font: 16px/1 var(--mono);
  background: #080b0f; border: 1px solid var(--line2); border-radius: 7px; color: var(--txt);
}
.calc-i:focus { outline: none; border-color: var(--acc); }
.calc-u { font-family: var(--mono); color: var(--dim); font-size: 13px; }

.ch { display: flex; flex-direction: column; gap: 8px; }
.ch-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px;
  background: #0e1218; cursor: pointer;
}
.ch-item:hover { border-color: var(--line2); }
.ch-item.sel { border-color: var(--acc); background: rgba(240,160,32,.06); }
.ch-key {
  flex: 0 0 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line2); border-radius: 4px; font: 11px/1 var(--mono); color: var(--dim);
}
.ch-body { display: flex; flex-direction: column; gap: 4px; }
.ch-t { font-size: 13px; }
.ch-d { font-size: 11px; color: var(--dim2); }

/* ---------------- 排序 / 配对 ---------------- */

.st { display: flex; flex-direction: column; gap: 6px; }
.st-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 8px; background: #0e1218; cursor: pointer;
}
.st-row:hover { border-color: var(--line2); }
.st-row.sel { border-color: var(--acc); background: rgba(240,160,32,.07); }
.st-n { width: 18px; color: var(--dim2); font: 11px/1 var(--mono); flex: 0 0 18px; }
.st-t { flex: 1; font-size: 13px; }
.st-btns { display: flex; gap: 4px; }
.st-b {
  width: 26px; height: 24px; border: 1px solid #3a4654; background: #1c232d;
  color: #c8d3de; border-radius: 5px; cursor: pointer; font-size: 12px; line-height: 1;
}
.st-b:hover:not(:disabled) { color: var(--txt); border-color: var(--dim); }
.st-b:disabled { opacity: .25; cursor: not-allowed; }
.st-tip { margin-top: 10px; font-size: 11px; color: var(--dim2); }

.mt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mt-col { display: flex; flex-direction: column; gap: 6px; }
.mt-item {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: #0e1218; cursor: pointer; font-size: 12.5px; min-height: 38px;
}
.mt-item:hover { border-color: var(--line2); }
.mt-left.sel { border-color: var(--acc); background: rgba(240,160,32,.07); }
.mt-item.bound { border-color: #2f4a63; }
.mt-t { flex: 1; }
.mt-badge {
  font-size: 10.5px; color: var(--blue); background: rgba(88,166,255,.1);
  padding: 2px 6px; border-radius: 4px; white-space: nowrap; max-width: 45%;
  overflow: hidden; text-overflow: ellipsis;
}
.mt-tip { margin-top: 10px; font-size: 11px; color: var(--dim2); }

/* ---------------- 反馈 / 知识卡 / 小测 ---------------- */

.fb { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--bg2); }
.fb.ok { border-color: rgba(63,185,80,.4); }
.fb.bad { border-color: rgba(248,81,73,.35); }
.fb-head { font-size: 14px; margin-bottom: 10px; }
.fb.ok .fb-head { color: var(--ok); }
.fb.bad .fb-head { color: var(--bad); }
.fb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.fb-item { padding-left: 12px; border-left: 2px solid var(--line2); }
.fb-item.bad { border-color: var(--bad); }
.fb-item.ok { border-color: var(--ok); }
.fb-item.warn { border-color: var(--warn); }
.fb-item.info { border-color: var(--blue); }
.fb-t { font-size: 13px; margin-bottom: 3px; }
.fb-x { font-size: 12px; color: var(--dim); line-height: 1.7; }

.kn { margin-top: 22px; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; background: var(--bg2); }
.kn-h { font-size: 12px; color: var(--acc); letter-spacing: .5px; margin-bottom: 14px; }
.kn-sec { margin-bottom: 16px; }
.kn-sec h3 { font-size: 12px; color: var(--dim2); font-weight: 400; margin: 0 0 6px; }
.kn-sec p { margin: 0; font-size: 13px; color: #c8d3de; line-height: 1.8; }
.kn-sec ol { margin: 0; padding-left: 20px; font-size: 13px; color: #c8d3de; line-height: 1.8; }
.mono { font-family: var(--mono); color: var(--acc) !important; font-size: 12px !important; }

.quiz { margin-top: 22px; border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; background: var(--bg2); }
.q { margin-bottom: 16px; }
.q-t { font-size: 13px; margin-bottom: 8px; }
.q-o { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--dim); padding: 4px 0; cursor: pointer; }
.q-o:hover { color: var(--txt); }
.qr-head { margin: 14px 0 8px; font-size: 13px; color: var(--acc); }
.qr { font-size: 12px; color: var(--dim); padding: 6px 0; border-top: 1px solid var(--line); line-height: 1.7; }
.qr.ok b { color: var(--ok); }
.qr.bad b { color: var(--bad); }

#toast {
  position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px);
  background: #1c232d; border: 1px solid var(--line2); color: var(--txt);
  padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none;
  transition: .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1400px) {
  /* 三列挤不下时：题面独占一行，操作区与侧栏并排。
     这样 topo 矩阵不用横向滚动也能看全 NUMA Affinity 那一列。 */
  .work { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); }
  .work > .p-left { grid-column: 1 / -1; }
  .work > .p-mid { grid-column: 1; }
  .work > .p-right { grid-column: 2; }
}

@media (max-width: 1180px) {
  .work { grid-template-columns: 1fr; }
  .work > .p-left, .work > .p-mid, .work > .p-right { grid-column: auto; }
  .map-row { grid-template-columns: 1fr; gap: 6px; }
  .map-n { text-align: left; }
}

/* ---------------- X1 取证终端 ---------------- */

.con {
  position: fixed; left: 0; right: 0; bottom: 0; height: 46vh; min-height: 260px;
  display: none; flex-direction: column;
  background: #070a0e; border-top: 1px solid #2f3a47;
  box-shadow: 0 -12px 40px rgba(0,0,0,.55); z-index: 60;
}
.con.on { display: flex; }
.con-head {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 16px; background: #11151c; border-bottom: 1px solid #222b36;
}
.con-t { font-size: 12px; color: var(--dim); }
.con-t em { font-style: normal; color: var(--acc); margin-left: 8px; }
.con-hint { font-size: 11px; color: var(--dim2); margin-left: auto; }
.con-x {
  background: none; border: 1px solid var(--line2); color: var(--dim);
  font-size: 11px; padding: 4px 10px; border-radius: 5px; cursor: pointer;
}
.con-x:hover { color: var(--txt); border-color: var(--dim); }
.con-out {
  flex: 1; overflow: auto; padding: 12px 16px;
  font: 11.5px/1.62 var(--mono); color: #c3cfdb; scrollbar-width: thin;
}
.con-out::-webkit-scrollbar { width: 8px; }
.con-out::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }
.con-block { white-space: pre; margin-bottom: 6px; }
.con-block.con-echo { color: #6f7f90; }
.con-block.con-echo::first-letter { color: var(--acc); }
.con-block.con-note { white-space: pre-wrap; color: var(--dim2); margin-bottom: 12px; }
.con-in {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-top: 1px solid #222b36; background: #11151c;
}
.con-p { color: var(--acc); font: 13px var(--mono); }
.con-in input {
  flex: 1; background: #070a0e; border: 1px solid #2f3a47; border-radius: 6px;
  color: var(--txt); font: 12.5px var(--mono); padding: 8px 10px;
}
.con-in input:focus { outline: none; border-color: var(--acc); }

.term-hint { font-size: 11px; color: var(--dim2); margin-left: 4px; }

.tpre-wrap { white-space: pre-wrap; word-break: break-word; }

/* ---------------- X3 能力雷达 ---------------- */

.hero-link { color: var(--acc); margin-left: 16px; font-size: 12px; }
.hero-link:hover { text-decoration: underline; }

.abil { display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 14px; margin-top: 18px; align-items: start; }
.ab-radar { display: flex; flex-direction: column; align-items: center; justify-content: center; }
.radar { width: 100%; max-width: 400px; height: auto; }
.ab-legend { font-size: 11px; color: var(--dim2); text-align: center; margin-top: 4px; line-height: 1.7; }

.ab-side { display: flex; flex-direction: column; gap: 9px; }
.ab-row { display: grid; grid-template-columns: 30px 1fr 110px 48px 44px; align-items: center; gap: 10px; font-size: 12px; }

<script>
(function (root) {
  'use strict';

  function hash(str) {
    var h = 2166136261 >>> 0;
    var s = String(str);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function Rng(seed) {
    this.s = (seed >>> 0) || 0x9e3779b9;
  }

  Rng.prototype.next = function () {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    var t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  Rng.prototype.int = function (n) {
    return Math.floor(this.next() * n);
  };

  Rng.prototype.pick = function (arr) {
    return arr[this.int(arr.length)];
  };

  Rng.prototype.chance = function (p) {
    return this.next() < p;
  };

  Rng.prototype.shuffle = function (arr) {
    var b = arr.slice();
    for (var i = b.length - 1; i > 0; i--) {
      var j = this.int(i + 1);
      var t = b[i]; b[i] = b[j]; b[j] = t;

<script>
(function (root) {
  'use strict';

  var CODE = {
    SELF: 'X', SYS: 'SYS', NODE: 'NODE', PIX: 'PIX', PXB: 'PXB', PHB: 'PHB', UNK: '?'
  };

  function num(id) {
    var m = String(id).match(/(\d+)$/);
    return m ? parseInt(m[1], 10) : 0;
  }

  function has(obj, key) {
    return !!obj && Object.prototype.hasOwnProperty.call(obj, key);
  }

  function deviceIds(cfg) {
    var ids = Object.keys(cfg.devices || {});
    ids.sort(function (a, b) {
      var ta = cfg.devices[a].type, tb = cfg.devices[b].type;
      if (ta !== tb) return ta === 'gpu' ? -1 : 1;
      return num(a) - num(b);
    });
    return ids;
  }

  function partType(cfg, id) {
    if (has(cfg.cpuPlacement, id)) return 'cpu';
    if (has(cfg.bridges, id)) return 'bridge';
    if (has(cfg.switches, id)) return 'switch';
    if (has(cfg.devices, id)) return cfg.devices[id].type === 'nic' ? 'nic' : 'gpu';
    return 'unknown';
  }

  function allParts(cfg) {
    var out = [];
    Object.keys(cfg.cpuPlacement).forEach(function (id) { out.push({ id: id, type: 'cpu' }); });
    Object.keys(cfg.bridges).forEach(function (id) { out.push({ id: id, type: 'bridge' }); });
    Object.keys(cfg.switches).forEach(function (id) { out.push({ id: id, type: 'switch' }); });
    Object.keys(cfg.devices).forEach(function (id) {
      out.push({ id: id, type: cfg.devices[id].type });
    });
    return out;
  }

  /* 从设备往根走，收集交换芯片链，最后落在桥 / CPU / NUMA 上 */
  function derivePath(cfg, id) {
    var d = cfg.devices && cfg.devices[id];
    var empty = { numa: null, cpu: null, bridge: null, switchPath: [], known: false };
    if (!d || !d.parent) return empty;

    var sw = [];
    var p = d.parent;
    var guard = 0;
    while (has(cfg.switches, p)) {
      sw.unshift(p);
      p = cfg.switches[p];
      if (++guard > 8) return empty;
    }

    var bridge = has(cfg.bridges, p) ? p : null;
    var cpu = bridge ? cfg.bridges[bridge] : null;
    var numa = null;
    if (cpu && has(cfg.cpuPlacement, cpu) && cfg.cpuPlacement[cpu] !== null) {
      numa = cfg.cpuPlacement[cpu];
    }
    return {
      numa: numa, cpu: cpu || null, bridge: bridge,
      switchPath: sw, known: numa !== null
    };
  }

  function samePath(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  /*
    判定顺序不可换：
    自己 → NVLink → NUMA → 桥 → 交换芯片路径 → 缺失
    NVLink 优先于 NUMA，因为 NVSwitch 跨 NUMA，物理上仍是卡间专线。
  */
  function relation(cfg, a, b) {
    if (a === b) return CODE.SELF;
    var da = (cfg.devices && cfg.devices[a]) || {};
    var db = (cfg.devices && cfg.devices[b]) || {};
    if (da.type === 'gpu' && db.type === 'gpu' && cfg.nvlink && cfg.nvlink.enabled) {
      return 'NV' + (cfg.nvlink.links || 4);
    }
    var pa = derivePath(cfg, a);
    var pb = derivePath(cfg, b);
    if (pa.numa === null || pb.numa === null) return CODE.UNK;
    if (pa.numa !== pb.numa) return CODE.SYS;
    if (pa.bridge !== pb.bridge) return CODE.NODE;
    if (pa.switchPath.length === 0 || pb.switchPath.length === 0) return CODE.PHB;
    if (samePath(pa.switchPath, pb.switchPath)) return CODE.PIX;
    return CODE.PXB;
  }

  function buildMatrix(cfg) {
    var ids = deviceIds(cfg);
    var cells = {};
    ids.forEach(function (a) {
      cells[a] = {};
      ids.forEach(function (b) { cells[a][b] = relation(cfg, a, b); });
    });
    return { ids: ids, cells: cells };
  }

  /* 只比 unordered pair，且不看零件标签 */
  function compareMatrix(truth, player) {
    var diffs = [];
    var ids = truth.ids.filter(function (id) { return player.cells[id]; });
    for (var i = 0; i < ids.length; i++) {
      for (var j = i + 1; j < ids.length; j++) {
        var a = ids[i], b = ids[j];
        var exp = truth.cells[a][b];
        var act = player.cells[a][b];
        if (exp !== act) diffs.push({ a: a, b: b, expected: exp, actual: act });
      }
    }
    return diffs;
  }

  function blankConfig(cfg) {
    var out = JSON.parse(JSON.stringify(cfg));
    Object.keys(out.cpuPlacement).forEach(function (c) { out.cpuPlacement[c] = null; });
    Object.keys(out.bridges).forEach(function (b) { out.bridges[b] = null; });
    Object.keys(out.switches).forEach(function (s) { out.switches[s] = null; });
    Object.keys(out.devices).forEach(function (d) { out.devices[d].parent = null; });
    return out;
  }

  function validateConfig(cfg) {
    var errors = [];
    if (!cfg || !cfg.meta) return { ok: false, errors: ['缺少 meta'] };
    var cpuIds = Object.keys(cfg.cpuPlacement || {});
    if (cpuIds.length !== cfg.meta.cpuCount) {
      errors.push('CPU 数量 ' + cpuIds.length + ' 与 meta ' + cfg.meta.cpuCount + ' 不符');
    }
    cpuIds.forEach(function (c) {
      var n = cfg.cpuPlacement[c];
      if (n === null) return;
      if (typeof n !== 'number' || n < 0 || n >= cfg.meta.cpuCount) {
        errors.push(c + ' 落在非法 NUMA ' + n);
      }
    });
    Object.keys(cfg.bridges || {}).forEach(function (b) {
      var cpu = cfg.bridges[b];
      if (cpu === null) return;
      if (!has(cfg.cpuPlacement, cpu)) errors.push(b + ' 挂在未知 CPU ' + cpu);
    });
    Object.keys(cfg.switches || {}).forEach(function (s) {
      var p = cfg.switches[s];
      if (p === null) return;
      if (!has(cfg.switches, p) && !has(cfg.bridges, p)) {
        errors.push(s + ' 挂在未知父节点 ' + p);
      }
      var guard = 0, cur = p, seen = {};
      while (cur && guard++ < 12) {
        if (seen[cur]) { errors.push(s + ' 出现环'); break; }
        seen[cur] = 1;
        cur = has(cfg.switches, cur) ? cfg.switches[cur] : (has(cfg.bridges, cur) ? cfg.bridges[cur] : null);
      }
    });
    var gpuCount = 0;
    Object.keys(cfg.devices || {}).forEach(function (d) {
      var dev = cfg.devices[d];
      if (dev.type === 'gpu') gpuCount++;
      var p = dev.parent;
      if (p === null) return;
      if (!has(cfg.switches, p) && !has(cfg.bridges, p)) {
        errors.push(d + ' 挂在未知父节点 ' + p);
      }
      if (has(cfg.devices, p)) errors.push(d + ' 挂在另一个设备下，非法');
    });
    if (gpuCount !== cfg.meta.gpuCount) {
      errors.push('GPU 数量 ' + gpuCount + ' 与 meta ' + cfg.meta.gpuCount + ' 不符');
    }
    return { ok: errors.length === 0, errors: errors };
  }

  /* ---------------- 生成器 ---------------- */

  function baseConfig(seed, gpuCount, level) {
    var half = gpuCount / 2;
    var cores = gpuCount >= 8 ? 48 : 32;
    var cfg = {
      seed: seed,
      level: level,
      cpuPlacement: { CPU0: 0, CPU1: 1 },
      bridges: { B0: 'CPU0', B1: 'CPU1' },
      switches: { S0: 'B0', S1: 'B1' },
      devices: {},
      nvlink: { enabled: false, links: 0 },
      meta: { gpuCount: gpuCount, cpuCount: 2, cores: cores, nicMode: '', level: level }
    };
    for (var i = 0; i < gpuCount; i++) {
      /* PCIe 机型：H100 PCIe 是 350W，别写成 SXM 的 700W */
      cfg.devices['GPU' + i] = {
        type: 'gpu', parent: i < half ? 'S0' : 'S1',
        mem: 81920, power: 350
      };
    }
    cfg.devices.NIC0 = { type: 'nic', parent: 'S0', speed: 400 };
    cfg.devices.NIC1 = { type: 'nic', parent: 'S1', speed: 400 };
    return cfg;
  }

  /*
    四种机型变体，各自能逼出一种关系码：
      canonical  网卡贴本路交换芯片        → PIX + SYS
      nicOnBridge 网卡直挂桥（不过交换机） → PHB
      extraSwitch 多一颗交换机串起来        → PXB
      cornered    两张网卡挤在同一路        → SYS 更多
  */
  function generateMachine(seed, level) {
    level = level || 1;
    var hard = level >= 2;
    var r = root.TopoRng.stream(seed, 'M03.machine.' + level);
    var gpuCount = hard ? 8 : 4;
    var cfg = baseConfig(seed, gpuCount, level);
    var variant = ['canonical', 'nicOnBridge', 'extraSwitch', 'cornered'][r.int(4)];

    if (variant === 'nicOnBridge') {
      cfg.devices.NIC0.parent = 'B0';
      cfg.devices.NIC1.parent = 'B1';
    } else if (variant === 'extraSwitch') {
      cfg.switches.S2 = 'S0';
      cfg.devices.NIC0.parent = 'S2';
      if (hard && r.chance(0.5)) {
        cfg.switches.S3 = 'S1';
        cfg.devices.NIC1.parent = 'S3';
      }
    } else if (variant === 'cornered') {
      cfg.devices.NIC0.parent = 'S0';
      cfg.devices.NIC1.parent = 'S0';
    }

    /* 一半几率让某一路的 GPU 不足半，制造跨桥（NODE）与 PHB */
    if (r.chance(0.45)) {
      var moveCount = hard ? 1 : 1;
      for (var k = 0; k < moveCount; k++) {
        var gid = 'GPU' + r.int(gpuCount);
        var dev = cfg.devices[gid];
        if (dev.parent === 'S0' && r.chance(0.5)) dev.parent = 'B0';
        else if (dev.parent === 'S1' && r.chance(0.5)) dev.parent = 'B1';
      }
    }

    cfg.meta.nicMode = variant;
    cfg.meta.variant = variant;
    return cfg;
  }

  /* ---------------- 格式化输出 ---------------- */

  function pad(s, n) {
    s = String(s);
    while (s.length < n) s += ' ';
    return s;
  }

  /* 真机用制表符对齐，列宽随内容浮动；这里固定 6 列宽，6 卡机型刚好不横向滚动 */
  var W = 6;

  /*
    真机输出末尾有 CPU Affinity 与 NUMA Affinity 两列，
    少了这两列，懂行的人一眼就知道是编的。

    表和图例分开返回：表要等宽不换行，图例要按栏宽折行，
    否则图例的长行会把横向滚动条撑开，把 Affinity 两列挤出可视区。
  */
  function formatTopoParts(cfg) {
    var mx = buildMatrix(cfg);
    var ids = mx.ids;
    var cores = (cfg.meta && cfg.meta.cores) || 48;
    var lines = [];
    var head = pad('', 9);
    ids.forEach(function (id) { head += pad(id, W); });
    head += pad('CPU Affinity', 16) + 'NUMA Affinity';
    lines.push(head.replace(/\s+$/, ''));
    ids.forEach(function (a) {
      var row = pad(a, 9);
      ids.forEach(function (b) { row += pad(mx.cells[a][b], W); });
      var p = derivePath(cfg, a);
      var aff = p.numa === null ? '?' : (p.numa * cores) + '-' + ((p.numa + 1) * cores - 1);
      row += pad(aff, 16) + (p.numa === null ? '?' : p.numa);
      lines.push(row.replace(/\s+$/, ''));
    });

    var legend = ['Legend:',
      '  X    = Self',
      '  SYS  = Connection traversing PCIe as well as the SMP interconnect between NUMA nodes (e.g., QPI/UPI)',
      '  NODE = Connection traversing PCIe as well as the interconnect between PCIe Host Bridges within a NUMA node',
      '  PHB  = Connection traversing PCIe as well as a PCIe Host Bridge (typically the CPU)',
      '  PXB  = Connection traversing multiple PCIe bridges (without traversing the PCIe Host Bridge)',
      '  PIX  = Connection traversing at most a single PCIe bridge',
      '  NV#  = Connection traversing a bonded set of # NVLinks'
    ].join('\n');

    return { table: lines.join('\n'), legend: legend };
  }

  function formatTopo(cfg) {
    var p = formatTopoParts(cfg);
    return p.table + '\n\n' + p.legend;
  }

  function formatLscpu(cfg) {
    var n = cfg.meta.cpuCount;
    var cores = cfg.meta.cores || 48;
    var lines = [];
    lines.push('Architecture:          x86_64');
    lines.push('CPU(s):                ' + (n * cores));
    lines.push('On-line CPU(s) list:   0-' + (n * cores - 1));
    lines.push('Thread(s) per core:    1');
    lines.push('Core(s) per socket:    ' + cores);
    lines.push('Socket(s):             ' + n);
    lines.push('NUMA node(s):          ' + n);
    for (var i = 0; i < n; i++) {
      lines.push('NUMA node' + i + ' CPU(s):      ' + (i * cores) + '-' + ((i + 1) * cores - 1));
    }
    lines.push('');
    lines.push('# 每个 Socket 就是一颗 CPU，对应一个 NUMA node。');
    lines.push('# 本题机型：' + (cfg.meta.gpuCount) + ' 卡 PCIe 机型，未配 NVLink。');
    return lines.join('\n');
  }

  /* 关系码 → 层级 + 人话解释，反馈质量靠这张表 */
  var CODE_INFO = {
    'X': { layer: '自身', short: '对角线', why: '自己和自己之间不需要通路。' },
    '?': { layer: '未定', short: '还没摆到位', why: '这条路径上有一方还没放进层级，反算不出来。' },
    'SYS': {
      layer: 'NUMA 层',
      short: '跨了 NUMA，要过 CPU 之间的 UPI',
      why: '两张卡分属不同 CPU，数据必须经过两颗 CPU 之间的互联，带宽掉到四分之一左右、延迟翻几倍。'
    },
    'NODE': {
      layer: 'NUMA 内的桥层',
      short: '同一个 NUMA 里，但分属不同的 PCIe 桥',
      why: '同一个 CPU 下有两个根端口，两条链路各自到 CPU 再折返，过了 Host Bridge 但没跨 NUMA。'
    },
    'PHB': {
      layer: 'Host Bridge 层',
      short: '有一方直接挂在 CPU 的根端口上',
      why: '设备没有经过任何交换芯片，链路直接进 CPU 的 Host Bridge，属于"最浅但要让 CPU 转发"的一种。'
    },
    'PXB': {
      layer: 'PCIe 桥层',
      short: '过了不止一颗 PCIe 桥 / 交换芯片',
      why: '两颗芯片串在同一颗桥下面但不在同一颗交换芯片里，要多穿一层 PCIe 桥。'
    },
    'PIX': {
      layer: '交换芯片层',
      short: '在同一颗 PCIe 交换芯片下',
      why: '两颗设备挂在同一颗交换芯片，一跳直达，这是 PCIe 域内最短的路径。'
    },
    'NV8': { layer: 'NVLink 层', short: '走了 8 条 NVLink', why: 'GPU 之间的专线，不经过 PCIe。' },
    'NV4': { layer: 'NVLink 层', short: '走了 4 条 NVLink', why: 'GPU 之间的专线，不经过 PCIe。' }
  };

  function codeInfo(code) {
    return CODE_INFO[code] || { layer: '未知', short: code, why: '' };
  }

  root.TopoModel = {
    CODE: CODE,
    num: num,
    has: has,
    deviceIds: deviceIds,
    partType: partType,
    allParts: allParts,
    derivePath: derivePath,
    relation: relation,
    buildMatrix: buildMatrix,
    compareMatrix: compareMatrix,
    blankConfig: blankConfig,
    validateConfig: validateConfig,
    generateMachine: generateMachine,
    formatTopo: formatTopo,
    formatTopoParts: formatTopoParts,
    formatLscpu: formatLscpu,
    codeInfo: codeInfo
  };

  if (typeof module === 'object' && module.exports) module.exports = root.TopoModel;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function (root) {
  'use strict';

  var M = root.TopoModel;

  /*
    target 形态：
      { kind:'tray' }
      { kind:'cpu',    numa:0 }
      { kind:'bridges', cpu:'CPU0' }
      { kind:'under',  host:'B0' }   // host 可以是桥，也可以是交换芯片
  */

  function isDescendant(cfg, ancestor, node) {
    var p = node, guard = 0;
    while (p && guard++ < 12) {
      if (p === ancestor) return true;
      if (M.has(cfg.switches, p)) { p = cfg.switches[p]; continue; }
      if (cfg.devices && cfg.devices[p]) { p = cfg.devices[p].parent; continue; }
      p = null;
    }
    return false;
  }

  function childCount(cfg, id) {
    var n = 0;
    Object.keys(cfg.switches || {}).forEach(function (s) { if (cfg.switches[s] === id) n++; });
    Object.keys(cfg.devices || {}).forEach(function (d) { if (cfg.devices[d].parent === id) n++; });
    return n;
  }

  function check(cfg, partId, target) {
    var type = M.partType(cfg, partId);
    if (type === 'unknown') return { ok: false, reason: '这不是一个零件。' };
    if (!target || target.kind === 'tray') {
      if (type === 'switch' && childCount(cfg, partId) > 0) {
        return { ok: false, reason: '这个交换芯片里还挂着设备，先把里面的零件取出来再送回托盘。' };
      }
      return { ok: true, reason: '' };
    }
    if (type === 'cpu') {
      if (target.kind !== 'cpu') return { ok: false, reason: 'CPU 只能放进 NUMA 楼的 CPU 槽位，不能放到桥或交换芯片下。' };
      return { ok: true, reason: '' };
    }
    if (type === 'bridge') {
      if (target.kind !== 'bridges') return { ok: false, reason: 'PCIe 桥只能挂在 CPU 下面。' };
      if (!target.cpu) return { ok: false, reason: '这个桥位还没有归属的 CPU。' };
      return { ok: true, reason: '' };
    }
    if (type === 'switch') {
      if (target.kind !== 'under') return { ok: false, reason: '交换芯片要挂在桥或另一颗交换芯片下面。' };
      if (!target.host) return { ok: false, reason: '这里还没有可挂靠的上级。' };
      if (target.host === partId) return { ok: false, reason: '不能把交换芯片挂到自己下面。' };

      return { ok: true, reason: '' };

    if (target.kind !== 'under') {
      return { ok: false, reason: '设备只能挂在交换芯片或 PCIe 桥下面。' };
    }
    if (!target.host) return { ok: false, reason: '这里还没有可挂靠的上级。' };

    if (st[0] === 'bridge') return st[1] + ' 下';
    if (st[0] === 'switch') return st[1] + ' 下';

(function (root) {
  'use strict';

  function round(n, digits) {
    var p = Math.pow(10, digits === undefined ? 3 : digits);
    return Math.round(n * p) / p;
  }

  /* 相对误差判定，避免浮点直接比较 */
  function near(actual, expected, tolRatio) {
    if (typeof actual !== 'number' || !isFinite(actual)) return false;
    var tol = Math.abs(expected) * (tolRatio === undefined ? 0.005 : tolRatio);
    if (Math.abs(expected) < 1e-9) return Math.abs(actual) < 1e-9;
    return Math.abs(actual - expected) <= tol;
  }

  /* 惩罚值：越远越贵。D 型题的判分入口 */
  var PENALTY = { PIX: 0, PXB: 1, PHB: 2, NODE: 3, SYS: 6, '?': 9, X: 0, NV8: 0, NV4: 0 };

  function penalty(code) {
    return PENALTY[code] === undefined ? 9 : PENALTY[code];
  }

  /*
    gap 是"比最优贵多少"。halfAt 是给半分的上限：
    默认 3，D 型题按方案规模传更大的值（8 卡机传 8）。
  */
  function byPenalty(actual, best, halfAt) {
    var gap = actual - best;
    var limit = halfAt === undefined ? 3 : halfAt;
    if (gap <= 0) return { score: 1, grade: 'best', gap: gap };
    if (gap <= limit) return { score: 0.5, grade: 'suboptimal', gap: gap };
    return { score: 0, grade: 'wrong', gap: gap };
  }

  function pct(part, whole) {
    if (!whole) return 0;
    return round((part / whole) * 100, 1);
  }

  root.TopoGrade = {
    PENALTY: PENALTY,
    round: round,
    near: near,
    penalty: penalty,
    byPenalty: byPenalty,
    pct: pct
  };

      prompt: function (scen) {

      },

          tone: ok ? 'ok' : 'info',
          title: '标准答案 ' + G.round(scen.expected, scen.digits === undefined ? 1 : scen.digits) + ' ' + scen.unit,
          text: scen.steps.map(function (s, i) { return (i + 1) + '. ' + s; }).join('<br>')

        return {

            G.round(scen.expected, scen.digits === undefined ? 1 : scen.digits) + ' ' + scen.unit + '。'),

      },
      hint: function (scen, ans, lv) {

        if (lv === 1) return '第二步：' + (scen.steps[scen.steps.length - 2] || scen.steps[0]);
        return '代进去：' + scen.steps[scen.steps.length - 1];

        var items = [];
        scen.left.forEach(function (l) {

          var exp = scen.right.filter(function (x) { return x.id === scen.pairs[l.id]; })[0];
          var act = scen.right.filter(function (x) { return x.id === got; })[0];
          items.push({

    return PLANES.map(function (p) {
      var mods = CATALOG.filter(function (m) { return m.plane === p.key; });
      return {

        modules: mods.map(function (m) {

        })

    for (var i = 0; i < CATALOG.length; i++) if (CATALOG[i].id === id) return CATALOG[i];

  root.TopoRegistry = {
    PLANES: PLANES,
    CATALOG: CATALOG,
    declare: declare,

<script>
(function (root) {
  'use strict';

  var KEY = 'aiInfraCampus.progress.v1';
  var memory = null;

  function blank() {
    return { modules: {}, wrong: [], updated: 0 };
  }

  function read() {
    if (memory) return memory;
    try {
      var raw = root.localStorage && root.localStorage.getItem(KEY);
      memory = raw ? JSON.parse(raw) : blank();
    } catch (e) {
      memory = blank();
    }
    if (!memory || !memory.modules) memory = blank();
    return memory;
  }

  function write(data) {
    memory = data;
    data.updated = Date.now();
    try {
      if (root.localStorage) root.localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      /* file:// 或隐私模式下静默降级，内存里还留着 */
    }
  }

  function stageKey(moduleId, stageKey) {
    return moduleId + ':' + stageKey;
  }

  function record(moduleId, stage, ok, meta) {
    var d = read();
    var k = stageKey(moduleId, stage);
    var rec = d.modules[k] || { tries: 0, ok: 0, best: 0, last: 0 };
    rec.tries += 1;
    if (ok) rec.ok += 1;
    if (meta && meta.score !== undefined) rec.best = Math.max(rec.best, meta.score);
    rec.last = Date.now();
    d.modules[k] = rec;
    if (!ok && meta && meta.tag) {
      d.wrong.push({ at: rec.last, moduleId: moduleId, stage: stage, tag: meta.tag });
      if (d.wrong.length > 200) d.wrong = d.wrong.slice(-200);
    }
    write(d);
  }

  function stageRecord(moduleId, stage) {
    return read().modules[stageKey(moduleId, stage)] || null;
  }

  function moduleProgress(moduleId) {
    var d = read();
    var keys = Object.keys(d.modules).filter(function (k) {
      return k.indexOf(moduleId + ':') === 0;
    });
    var done = keys.filter(function (k) { return d.modules[k].ok > 0; }).length;
    return { done: done, total: keys.length };
  }

  function reset() {
    write(blank());
  }

  /* 测试与"导入进度"用：直接注入一份记录，同时落到内存与本地存储 */
  function load(data) {
    var d = blank();
    if (data && data.modules) d.modules = data.modules;
    if (data && data.wrong) d.wrong = data.wrong;
    write(d);
  }

  root.TopoProgress = {
    read: read,
    record: record,
    stageRecord: stageRecord,
    moduleProgress: moduleProgress,
    reset: reset,
    load: load
  };

  if (typeof module === 'object' && module.exports) module.exports = root.TopoProgress;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
(function (root) {
  'use strict';

  var M = root.TopoModel;

  /* ============================================================
     X1 命令行台
     设计原则：命令的输出只能来自"当前关卡的现场"。
     没有现场时，退化成一台参考机型，并且明确告诉玩家这不是本关的机器。
     ============================================================ */

  var DRIVER = '550.54.15';
  var CUDA = '12.4';

  function pad(s, n) {
    s = String(s);
    while (s.length < n) s = ' ' + s;
    return s;
  }
  function padR(s, n) {
    s = String(s);
    while (s.length < n) s += ' ';
    return s;
  }
  function line(ch, n) {
    var out = '';
    for (var i = 0; i < n; i++) out += ch;
    return out;
  }

  /* ---------------- 现场 ---------------- */

  function refGpu(i) {
    return {
      idx: i,
      name: 'NVIDIA H100 80GB HBM3',
      bus: '00000000:' + (0x3b + i * 2).toString(16).toUpperCase() + ':00.0',
      uuid: 'GPU-' + (0x4a1f2b3c + i * 7919).toString(16),
      temp: 62 + (i % 3) * 4,
      power: 640 + (i % 4) * 15,
      cap: 700,
      memTotal: 81920,
      memUsed: 71200 + (i % 5) * 1800,
      util: 88 + (i % 6) * 2,
      eccDbe: 0, eccSbe: 0, retired: 0,
      pcieGen: 5, pcieWidth: 16,
      nvlinkCrc: 0, nvlinkLinks: 18,
      smClock: 1410, memClock: 2619, throttle: null,
      absent: false
    };
  }

  /*
    监控世界：带外（BMC）与 Prometheus / 计费。
    L0 的电力与散热、L5 的成本与推理，证据都不在主机 shell 里，
    所以这一层是独立的数据源，不是把 nvidia-smi 换个说法。
  */
  function refMon() {
    var gTemps = [], gUtil = [];
    for (var i = 0; i < 8; i++) {
      gTemps.push({ labels: { host: 'gpu-node-07', gpu: String(i) }, v: 68 + (i % 3) * 3 });
      gUtil.push({ labels: { host: 'gpu-node-07', gpu: String(i) }, v: 91 + (i % 4) });
    }
    return {
      rack: {
        id: 'A01', row: 'R03',
        pdu: [
          { name: 'PDU-A', branch: 'L1', loadA: 38.4, capA: 60 },
          { name: 'PDU-B', branch: 'L2', loadA: 37.6, capA: 60 }
        ]
      },
      bmc: {
        inlet: 24, exhaust: 38, fanPct: 46,
        nodeWatts: 6120, nodeCap: 10200,
        psus: [
          { id: 'PSU1', watts: 1510, status: 'ok' },
          { id: 'PSU2', watts: 1490, status: 'ok' },
          { id: 'PSU3', watts: 1500, status: 'ok' },
          { id: 'PSU4', watts: 1470, status: 'ok' }
        ],
        sel: [
          '   1 | 11/12/2026 | 04:02:18 | Power Supply PSU3 | Power Supply AC lost | Asserted',
          '   2 | 11/12/2026 | 04:02:19 | Power Supply PSU3 | Power Supply AC lost | Deasserted'
        ]
      },
      metrics: {
        rack_power_kw: {
          unit: 'kW', help: '机柜总功耗（PDU 合计）',
          series: [{ labels: { rack: 'A01' }, v: 12.2 }]
        },
        pdu_current_a: {
          unit: 'A', help: 'PDU 支路电流',
          series: [
            { labels: { rack: 'A01', pdu: 'A' }, v: 38.4 },
            { labels: { rack: 'A01', pdu: 'B' }, v: 37.6 }
          ]
        },
        gpu_temp_c: { unit: 'C', help: 'GPU 温度', series: gTemps },
        gpu_util_pct: { unit: '%', help: 'GPU SM 利用率', series: gUtil },
        ttft_p99_ms: { unit: 'ms', help: '首 token 延迟 P99', series: [{ labels: { svc: 'infer-bert' }, v: 212 }] },
        request_queue_depth: { unit: 'req', help: '排队等待的请求数', series: [{ labels: { svc: 'infer-bert' }, v: 0 }] },
        container_cpu_throttled_ratio: { unit: 'ratio', help: '容器 CPU 被限流的比例', series: [{ labels: { pod: 'infer-bert-0' }, v: 0.02 }] }
      },
      bill: {
        team: 'nlp', period: '2026-11-01 ~ 2026-11-25', days: 25,
        resource: 'H100 80G', cards: 32, gpuHours: 18432, price: 28, utilPct: 71.4
      }
    };
  }

  function referenceWorld() {
    var gpus = [];
    for (var i = 0; i < 8; i++) gpus.push(refGpu(i));
    return {
      kind: 'reference',
      host: 'gpu-node-07',
      mon: refMon(),
      driver: DRIVER, cuda: CUDA,
      gpus: gpus,
      nics: [
        { dev: 'mlx5_0', state: 'Active', rate: 400, numa: 0 },
        { dev: 'mlx5_1', state: 'Active', rate: 400, numa: 0 },
        { dev: 'mlx5_2', state: 'Active', rate: 400, numa: 1 },
        { dev: 'mlx5_3', state: 'Active', rate: 400, numa: 1 }
      ],
      numa: [
        { id: 0, cpus: '0-47', memMB: 515000 },
        { id: 1, cpus: '48-95', memMB: 515000 }
      ],
      kernel: ['[    0.000000] Linux version 5.15.0-105-generic (gcc 11.4.0)'],
      pods: [
        { name: 'train-0', ns: 'ai', status: 'Running', node: 'gpu-node-07', restarts: 0, cpu: '9200m', mem: '48.2Gi' },
        { name: 'train-1', ns: 'ai', status: 'Running', node: 'gpu-node-08', restarts: 0, cpu: '9180m', mem: '47.9Gi' }
      ],
      hpa: [
        { name: 'infer-bert', ns: 'ai', ref: 'Deployment/infer-bert', targets: '24%/70%', min: 2, max: 20, replicas: 3 }
      ],
      etcd: { fsyncMs: 0.84, dbSize: '418 MB', leader: true },
      mem: { avail: '186Gi', swapUsed: '1.2Gi', swapFree: '6.8Gi' }
    };
  }

  /* 从 M03 的拓扑模型生成现场：矩阵、lspci、网卡 NUMA 全都来自真配置 */
  function fromConfig(cfg) {
    var w = referenceWorld();
    w.kind = 'model';
    w.config = cfg;
    var gpus = [], nics = [], ni = 0;
    var ids = M.deviceIds(cfg);
    var gi = 0;
    ids.forEach(function (id) {
      var d = cfg.devices[id];
      var p = M.derivePath(cfg, id);
      if (d.type === 'gpu') {
        var g = refGpu(gi);
        g.idx = gi;
        g.bus = '00000000:' + (0x3b + gi * 2).toString(16).toUpperCase() + ':00.0';
        g.numa = p.numa === null ? 0 : p.numa;
        gpus.push(g);
        gi++;
      } else {
        nics.push({
          dev: 'mlx5_' + ni,
          state: 'Active',
          rate: d.speed || 400,
          numa: p.numa === null ? 0 : p.numa,
          gpuIdx: gi
        });
        ni++;
      }
    });
    w.gpus = gpus;
    w.nics = nics;
    return w;
  }

  function mergeMon(base, ov) {
    var m = JSON.parse(JSON.stringify(base));
    if (ov.rack) {
      Object.keys(ov.rack).forEach(function (k) {
        if (k === 'pdu' && ov.rack.pdu) m.rack.pdu = JSON.parse(JSON.stringify(ov.rack.pdu));
        else m.rack[k] = ov.rack[k];
      });
    }
    if (ov.bmc) {
      Object.keys(ov.bmc).forEach(function (k) { m.bmc[k] = JSON.parse(JSON.stringify(ov.bmc[k])); });
    }
    if (ov.bill) {
      Object.keys(ov.bill).forEach(function (k) { m.bill[k] = ov.bill[k]; });
    }
    if (ov.metrics) {
      Object.keys(ov.metrics).forEach(function (name) {
        var patch = ov.metrics[name];
        var cur = m.metrics[name];
        if (!cur) { m.metrics[name] = JSON.parse(JSON.stringify(patch)); return; }
        /* 只改一个数时用 {v: x}，整组换掉时用 {series: [...]} */
        if (patch.series) cur.series = JSON.parse(JSON.stringify(patch.series));
        else if (patch.v !== undefined) cur.series.forEach(function (s) { s.v = patch.v; });
        if (patch.unit) cur.unit = patch.unit;
        if (patch.help) cur.help = patch.help;
      });
    }
    return m;
  }

  /*
    world 覆盖：关卡可以只声明"哪张卡坏了"，其余走默认。
    这样每个案例只写三五行，不用复制一整台机器。
  */
  function applyOverrides(base, ov) {
    if (!ov) return base;
    var w = JSON.parse(JSON.stringify(base));
    w.kind = 'scene';
    if (ov.host) w.host = ov.host;
    if (ov.mon) {
      w.mon = mergeMon(refMon(), ov.mon);
      w.mon.custom = true;
    }
    if (ov.gpuCount) {
      w.gpus = [];
      for (var i = 0; i < ov.gpuCount; i++) w.gpus.push(refGpu(i));
    }
    /* 整机同一种病（比如全部卡都被高温降频）用 gpuAll，别抄八遍 */
    if (ov.gpuAll) {
      w.gpus.forEach(function (g) {
        Object.keys(ov.gpuAll).forEach(function (k) { g[k] = ov.gpuAll[k]; });
      });
    }
    (ov.gpus || []).forEach(function (patch) {
      var g = w.gpus[patch.idx];
      if (!g) { g = refGpu(patch.idx); w.gpus[patch.idx] = g; }
      Object.keys(patch).forEach(function (k) { g[k] = patch[k]; });
    });
    if (ov.absent) {
      ov.absent.forEach(function (i) { if (w.gpus[i]) w.gpus[i].absent = true; });
    }
    if (ov.nics) w.nics = ov.nics;
    if (ov.numa) w.numa = ov.numa;
    if (ov.kernel) w.kernel = ov.kernel;
    if (ov.pods) w.pods = ov.pods;
    if (ov.etcd) w.etcd = ov.etcd;
    if (ov.mem) w.mem = ov.mem;
    if (ov.hpa) w.hpa = ov.hpa;
    if (ov.irqHot) w.irqHot = true;
    if (ov.config) w.config = ov.config;
    return w;
  }

  /* ---------------- 格式化 ---------------- */

  function nowStr() {
    var d = new Date();
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var mon = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function two(n) { return n < 10 ? '0' + n : '' + n; }
    return days[d.getDay()] + ' ' + mon[d.getMonth()] + ' ' + two(d.getDate()) + ' ' +
      two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) + ' ' + d.getFullYear();
  }

  var S1 = 41, S2 = 26, S3 = 22;

  /* 表格一律按列宽截断再补齐，保证边框永远对齐（手写宽度一定会算错） */
  function row3(a, b, c) {
    return '|' + padR(String(a).slice(0, S1), S1) +
      '|' + padR(String(b).slice(0, S2), S2) +
      '|' + padR(String(c).slice(0, S3), S3) + '|';
  }
  function sep(ch) {
    return '+' + line(ch, S1) + '+' + line(ch, S2) + '+' + line(ch, S3) + '+';
  }

  function smiTable(w) {
    var out = [nowStr()];
    out.push(sep('-'));
    out.push(row3(' NVIDIA-SMI ' + w.driver, 'Driver Version: ' + w.driver, 'CUDA Version: ' + w.cuda));
    out.push(sep('-'));
    out.push(row3(' GPU  Name                 Persistence-M', 'Bus-Id        Disp.A', 'Volatile Uncorr. ECC'));
    out.push(row3(' Fan  Temp   Perf          Pwr:Usage/Cap', 'Memory-Usage', 'GPU-Util  Compute M.'));
    out.push(sep('='));
    var shown = 0;
    w.gpus.forEach(function (g) {
      if (g.absent) return;
      shown++;
      out.push(row3(
        ' ' + pad(g.idx, 3) + '  ' + padR(g.name.replace('NVIDIA ', ''), 24) + ' On',
        padR(g.bus + ' Off', S2),
        pad(g.eccDbe, S3 - 2) + '  '
      ));
      out.push(row3(
        ' N/A ' + padR(g.temp + 'C', 5) + ' P0 ' + padR(g.power + 'W / ' + g.cap + 'W', 17),
        padR(g.memUsed + 'MiB / ' + g.memTotal + 'MiB', S2 - 1),
        padR(g.util + '%', 9) + '  Default'
      ));
      out.push(sep('-'));
    });
    out.push('');
    out.push(sep('-'));
    out.push(row3(' Processes:', '', ''));
    out.push(row3('  GPU  GI  CI     PID  Type  Process name    ', 'Usage', ''));
    out.push(sep('='));
    if (shown) {
      out.push(row3('    0  N/A N/A  20481    C  python          ', pad(71200 + 'MiB', S2), ''));
    }
    out.push(sep('-'));
    if (shown < w.gpus.length) {
      out.push('');
      out.push('# 只列出 ' + shown + ' 张卡，另外 ' + (w.gpus.length - shown) + ' 张没有出现在 nvidia-smi 里。');
    }
    return out.join(String.fromCharCode(10));
  }

  function smiList(w) {
    var out = [];
    w.gpus.forEach(function (g) {
      if (g.absent) return;
      out.push('GPU ' + g.idx + ': ' + g.name + ' (UUID: ' + g.uuid + ')');
    });
    return out.join('\n');
  }

  function smiQuery(w) {
    var out = ['==============NVSMI LOG==============', ''];
    out.push('Timestamp                                 : ' + nowStr());
    out.push('Driver Version                            : ' + w.driver);
    out.push('CUDA Version                              : ' + w.cuda);
    out.push('');
    out.push('Attached GPUs                             : ' + w.gpus.filter(function (g) { return !g.absent; }).length);
    w.gpus.forEach(function (g) {
      if (g.absent) return;
      out.push('');
      out.push('GPU ' + g.bus);
      out.push('    Product Name                          : ' + g.name);
      out.push('    Minor Number                          : ' + g.idx);
      out.push('    ECC Mode');
      out.push('        Current                           : Enabled');
      out.push('        Pending                           : Enabled');
      out.push('    Volatile Uncorr. ECC');
      out.push('        Device Memory                     : ' + g.eccDbe);
      out.push('    Retired Pages');
      out.push('        Double Bit Error Page Retirement  : ' + g.retired);
      out.push('    PCI');
      out.push('        Link Width                        : ' + g.pcieWidth + 'x');
      out.push('        Max Link Width                    : 16x');
      out.push('        Link Gen                          : ' + g.pcieGen);
      out.push('    Temperature');
      out.push('        GPU Current Temp                  : ' + g.temp + ' C');
      out.push('    Clocks');
      out.push('        SM                                : ' + g.smClock + ' MHz');
      out.push('        Memory                            : ' + g.memClock + ' MHz');
      out.push('    Clocks Throttle Reasons');
      ['Idle', 'SW Power Cap', 'HW Slowdown', 'HW Thermal Slowdown'].forEach(function (rs) {
        out.push('        ' + padR(rs, 34) + ': ' + (g.throttle === rs ? 'Active' : 'Not Active'));
      });
    });
    return out.join('\n');
  }

  function nvlinkErr(w) {
    var out = [];
    w.gpus.forEach(function (g) {
      if (g.absent) return;
      out.push('GPU ' + g.idx + ': ' + g.name + ' (UUID: ' + g.uuid + ')');
      var links = g.nvlinkLinks || 18;
      for (var i = 0; i < links; i++) {
        var crc = (i === (g.nvlinkBad || -1)) ? (g.nvlinkCrc || 4200) : 0;
        out.push('\t Link ' + i + ': ' + crc + ' CRC errors');
      }
      out.push('');
    });
    return out.join('\n');
  }

  function topoText(w) {
    if (w.config) return M.formatTopo(w.config);
    return ['        GPU0    GPU1    GPU2    GPU3    NIC0    CPU Affinity   NUMA Affinity',
      'GPU0     X      NV8     NV8     NV8     PIX     0-47           0',
      'GPU1    NV8      X      NV8     NV8     PIX     0-47           0',
      'GPU2    NV8     NV8      X      NV8     SYS     48-95          1',
      'GPU3    NV8     NV8     NV8      X      SYS     48-95          1',
      'NIC0    PIX     PIX     SYS     SYS      X      -              -',
      '',
      'Legend:',
      '  X    = Self',
      '  SYS  = Connection traversing PCIe as well as the SMP interconnect between NUMA nodes',
      '  NV#  = Connection traversing a bonded set of # NVLinks'].join('\n') +
      '\n\n# 参考机型（4 卡示意）。本关没有专属拓扑，完整矩阵见 M03。';
  }

  function lspciText(w) {
    var out = ['-[0000:00]-+-00.0  Intel Corporation Device 1a20'];
    w.gpus.forEach(function (g) {
      var mark = g.absent ? '  [driver not bound]' : '';
      out.push('           +-' + g.bus.slice(9, 12).toLowerCase() + '.0  NVIDIA Corporation ' +
        g.name.replace('NVIDIA ', '') + ' [LnkCap: ' + g.pcieGen + ' x16, LnkSta: ' +
        g.pcieGen + ' x' + g.pcieWidth + ']' + mark);
    });
    w.nics.forEach(function (n, i) {
      out.push('           +-' + (0x5e + i).toString(16) + '.0  Mellanox Technologies MT2910 [' + n.dev + ']');
    });
    return out.join('\n');
  }

  function lscpuText(w) {
    var total = 0;
    w.numa.forEach(function (n) {
      var m = String(n.cpus).split('-');
      total += (m.length > 1 ? Number(m[1]) - Number(m[0]) + 1 : 1);
    });
    var out = ['Architecture:          x86_64',
      'CPU(s):                ' + total,
      'Thread(s) per core:    1',
      'Core(s) per socket:    ' + (total / w.numa.length | 0),
      'Socket(s):             ' + w.numa.length,
      'NUMA node(s):          ' + w.numa.length];
    w.numa.forEach(function (n) { out.push('NUMA node' + n.id + ' CPU(s):      ' + n.cpus); });
    return out.join('\n');
  }

  function numactlText(w) {
    var out = ['available: ' + w.numa.length + ' nodes (0-' + (w.numa.length - 1) + ')'];
    w.numa.forEach(function (n) {
      out.push('node ' + n.id + ' cpus: ' + n.cpus);
      out.push('node ' + n.id + ' size: ' + n.memMB + ' MB');
    });
    out.push('');
    out.push('node distances:');
    out.push('node  ' + w.numa.map(function (n) { return padR(n.id, 6); }).join(''));
    w.numa.forEach(function (a) {
      out.push(padR(a.id, 6) + w.numa.map(function (b) { return padR(a.id === b.id ? 10 : 21, 6); }).join(''));
    });
    return out.join('\n');
  }

  function ibstatText(w) {
    var out = [];
    w.nics.forEach(function (n) {
      out.push('CA \'' + n.dev + '\'');
      out.push('\tCA type: MT2910');
      out.push('\tNumber of ports: 1');
      out.push('\tFirmware version: 28.39.1002');
      out.push('\tPort 1:');
      out.push('\t\tState: ' + (n.state || 'Active'));
      out.push('\t\tPhysical state: LinkUp');
      out.push('\t\tRate: ' + n.rate);
      out.push('\t\tLink layer: InfiniBand');
      out.push('');
    });
    return out.join('\n') || 'ibstat: no IB devices found';
  }

  function dmesgText(w) {
    if (!w.kernel || !w.kernel.length) return '# kernel ring buffer is empty in this scene';
    return w.kernel.join('\n');
  }

  function freeText(w) {
    var m = (w && w.mem) || {};
    var used = m.used || '812Gi';
    var free = m.free || '18Gi';
    var buff = m.buff || '190Gi';
    var avail = m.avail || '186Gi';
    var swapUsed = m.swapUsed || '1.2Gi';
    var swapFree = m.swapFree || '6.8Gi';
    return ['               total        used        free      shared  buff/cache   available',
      'Mem:           1.0Ti' + pad(used, 12) + pad(free, 12) + pad('2.1Gi', 12) + pad(buff, 12) + pad(avail, 11),
      'Swap:          8.0Gi' + pad(swapUsed, 12) + pad(swapFree, 11)].join('\n');
  }

  function kubectlText(w, sub) {
    if (/^(get|describe)\s+hpa/.test(sub)) return hpaText(w, sub);
    if (/^top\s+pods?$/.test(sub)) return topText(w);
    if (!sub || sub === 'get pods' || sub === 'get pod') {
      var out = ['NAMESPACE   NAME            READY   STATUS              RESTARTS   AGE   NODE'];
      w.pods.forEach(function (p) {
        var ready = (p.status === 'Running') ? '1/1' : '0/1';
        out.push(padR(p.ns, 12) + padR(p.name, 16) + padR(ready, 8) + padR(p.status, 20) +
          padR(p.restarts, 11) + padR('3h', 6) + p.node);
      });
      return out.join('\n');
    }
    var m = sub.match(/describe\s+pod\s+(\S+)/);
    if (m) {
      var pod = null;
      w.pods.forEach(function (p) { if (p.name === m[1]) pod = p; });
      if (!pod) return 'Error from server (NotFound): pods "' + m[1] + '" not found';
      var nodeLine = (pod.node && pod.node !== '<none>') ? (pod.node + '/10.0.3.21') : '<none>';
      var out2 = ['Name:         ' + pod.name,
        'Namespace:    ' + pod.ns,
        'Node:         ' + nodeLine,
        'Status:       ' + pod.status,
        'Restart Count: ' + pod.restarts,
        '',
        'Events:',
        '  Type     Reason     Age   From      Message',
        '  ----     ------     ----  ----      -------'];
      (pod.events || ['  Normal   Started    3h    kubelet   Started container trainer']).forEach(function (e) {
        out2.push(e);
      });
      return out2.join('\n');
    }
    return 'kubectl: 支持 get pods / describe pod <name> / get hpa / describe hpa <name> / top pods';
  }

  function etcdText(w) {
    var e = w.etcd || {};
    return ['+----------------+---------+---------+------------+------------+-----------+------------+--------------------+',
      '|    ENDPOINT    |    ID   | VERSION | DB SIZE    | IS LEADER  | IS LEARNER| RAFT TERM  | RAFT APPLIED INDEX |',
      '+----------------+---------+---------+------------+------------+-----------+------------+--------------------+',
      '| 127.0.0.1:2379 | 8e9e05c5|  3.5.12 |  ' + padR(e.dbSize || '418 MB', 8) + ' |  ' + padR(e.leader ? 'true' : 'false', 8) + ' |   false   |     41     |      918273        |',
      '+----------------+---------+---------+------------+------------+-----------+------------+--------------------+',
      '',
      'wal_fsync_duration_seconds{quantile="0.99"}  ' + (e.fsyncMs || 0.84)].join('\n');
  }

  function lsmodText(w, filt) {
    var mods = w.modules || ['nvidia', 'nvidia_uvm', 'nvidia_drm', 'mlx5_core', 'mlx5_ib', 'ib_core', 'nvidia_peermem'];
    if (filt) mods = mods.filter(function (m) { return m.indexOf(filt) >= 0; });
    if (!mods.length) return '';
    var out = ['Module                  Size  Used by'];
    mods.forEach(function (m) { out.push(padR(m, 22) + pad(16384000, 10) + '  12'); });
    return out.join(String.fromCharCode(10));
  }

  function interruptsText(w) {
    if (w && w.irqHot) {
      return ['           CPU0       CPU1       ...      CPU47',
        '  0:         12          0       ...         0   IO-APIC   2-edge      timer',
        ' 94:          0          0       ...    918273   PCI-MSI 524288-edge   mlx5_comp0',
        ' 95:          0          0       ...    812739   PCI-MSI 524289-edge   mlx5_comp1',
        ' 96:          0          0       ...    701223   PCI-MSI 524290-edge   mlx5_comp2',
        ' 97:          0          0       ...    688901   PCI-MSI 524291-edge   mlx5_comp3',
        '',
        '# 四条队列的中断全部落在 CPU47。'].join('\n');
    }
    return ['           CPU0       CPU1       ...      CPU47',
      '  0:         12          0       ...         0   IO-APIC   2-edge      timer',
      ' 94:      231882      188211       ...    204117   PCI-MSI 524288-edge   mlx5_comp0',
      ' 95:      229104      191002       ...    198776   PCI-MSI 524289-edge   mlx5_comp1',
      '',
      '# 中断分散在多颗核上。'].join('\n');
  }

  /* ---------------- 带外 / 监控 ---------------- */

  function defSensors(b) {
    var rows = [
      { n: 'Inlet Temp', v: b.inlet + ' degrees C', s: b.inlet >= 32 ? 'cr' : (b.inlet > 27 ? 'nc' : 'ok') },
      { n: 'Exhaust Temp', v: b.exhaust + ' degrees C', s: 'ok' },
      { n: 'Fan1', v: Math.round(b.fanPct * 182) + ' RPM', s: 'ok' },
      { n: 'Fan2', v: Math.round(b.fanPct * 178) + ' RPM', s: 'ok' },
      { n: 'Pwr Consumption', v: b.nodeWatts + ' Watts', s: 'ok' }
    ];
    (b.psus || []).forEach(function (p) {
      var bad = p.status !== 'ok';
      rows.push({ n: p.id + ' Power', v: (bad ? 0 : p.watts) + ' Watts', s: bad ? 'ns' : 'ok' });
      rows.push({ n: p.id + ' Status', v: bad ? '0x00' : '0x01', s: bad ? 'ns' : 'ok' });
    });
    return rows;
  }

  function ipmiSdrText(w) {
    var b = w.mon.bmc;
    var rows = b.sensors || defSensors(b);
    return rows.map(function (s) {
      return padR(s.n, 16) + '| ' + padR(s.v, 18) + '| ' + s.s;
    }).join('\n');
  }

  function ipmiSelText(w) {
    var rows = w.mon.bmc.sel || [];
    if (!rows.length) return 'SEL has no entries.';
    return ['   ID | Date        | Time     | Sensor             | Event                    | State',
      '------+-------------+----------+--------------------+--------------------------+--------']
      .concat(rows).join('\n');
  }

  var SEL_LABEL = /^([a-zA-Z_:][a-zA-Z0-9_:]*)(?:\{(.*)\})?$/;

  function parseSel(s) {
    var m = String(s || '').trim().match(SEL_LABEL);
    if (!m) return null;
    var labels = {};
    if (m[2]) {
      m[2].split(',').forEach(function (kv) {
        var p = kv.split('=');
        if (p.length !== 2) return;
        labels[p[0].trim()] = p[1].trim().replace(/^["']/, '').replace(/["']$/, '');
      });
    }
    return { name: m[1], labels: labels };
  }

  function labelStr(labels) {
    var keys = Object.keys(labels);
    if (!keys.length) return '{}';
    return '{' + keys.map(function (k) { return k + '="' + labels[k] + '"'; }).join(', ') + '}';
  }

  function promText(w, raw) {
    var expr = String(raw || '').trim().replace(/^["']/, '').replace(/["']$/, '');
    if (!expr) return "prom: 用法 prom query '<表达式>'，例 prom query 'gpu_util_pct'";
    var ts = Math.floor(Date.now() / 1000);
    var agg = null;
    var inner = expr;
    var am = expr.match(/^(avg|max|min|sum)\((.*)\)$/);
    if (am) { agg = am[1]; inner = am[2]; }

    var sel = parseSel(inner);
    if (!sel) return 'prom: 解析不了「' + expr + '」。本机 prom 只支持即时查询（指标名 + label 过滤 + avg/max/min/sum）。';
    var metric = w.mon.metrics[sel.name];
    if (!metric) {
      return 'prom: 没有叫「' + sel.name + '」的指标。可用的有：\n  ' +
        Object.keys(w.mon.metrics).join('\n  ');
    }
    var head = '# prom query: ' + expr + '   （' + (metric.help || '无说明') + '，单位 ' + (metric.unit || '-') + '）';
    if (!metric.series || !metric.series.length) {
      return head + '\n# 0 series：这个指标没有采集到样本。';
    }

    var picked = metric.series.filter(function (s) {
      return Object.keys(sel.labels).every(function (k) { return s.labels[k] === sel.labels[k]; });
    });
    if (!picked.length) {
      return head + '\n# 0 series：这个 label 组合没有数据。';
    }
    if (agg) {
      var vals = picked.map(function (s) { return s.v; });
      var v = agg === 'avg' ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length
        : agg === 'max' ? Math.max.apply(null, vals)
          : agg === 'min' ? Math.min.apply(null, vals)
            : vals.reduce(function (a, b) { return a + b; }, 0);
      v = Math.round(v * 100) / 100;
      return head + '\n{} => ' + v + ' @[' + ts + ']   # ' + agg + ' over ' + picked.length + ' series';
    }
    return head + '\n' + picked.map(function (s) {
      return labelStr(s.labels) + ' => ' + s.v + ' @[' + ts + ']';
    }).join('\n');
  }

  function num(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function billText(w, cmd) {
    var b = w.mon.bill;
    var m = String(cmd).match(/--team\s+(\S+)/);
    if (m && m[1] !== b.team) {
      return 'bill: 没有「' + m[1] + '」这个团队的账单。本机只挂了 ' + b.team + ' 的账。';
    }
    var amount = b.gpuHours * b.price;
    var eff = Math.round(b.gpuHours * b.utilPct / 100);
    var idle = b.gpuHours - eff;
    var idleCost = idle * b.price;
    var pct = b.gpuHours > 0 ? Math.round(idle / b.gpuHours * 1000) / 10 : 0;
    var rows = [
      '计费周期   ' + b.period + '（' + b.days + ' 天）        团队  ' + b.team,
      '资源       卡数   卡时        单价            金额',
      padR(b.resource, 11) + padR(b.cards, 7) + padR(num(b.gpuHours), 12) +
      padR('¥' + b.price + '.00/卡时', 16) + '¥' + num(amount),
      '',
      b.gpuHours > 0
        ? '有效算力   平均 SM 利用率 ' + b.utilPct + '%  →  ' + num(eff) + ' 有效卡时'
        : '有效算力   本周期没有卡时记录',
      '闲置成本   ' + num(idle) + ' 卡时 × ¥' + b.price + ' = ¥' + num(idleCost) + '（占 ' + pct + '%）',
      '账单口径   按卡时计费：卡空转也照收，利用率不影响账单。'
    ];
    return rows.join('\n');
  }

  function hpaText(w, sub) {
    var list = w.hpa || [];
    if (sub.indexOf('describe') === 0) {
      var nm = sub.replace(/.*hpa\s*/, '').trim();
      var h = null;
      list.forEach(function (x) { if (x.name === nm) h = x; });
      if (!h) return 'Error from server (NotFound): horizontalpodautoscalers.autoscaling "' + nm + '" not found';
      var parts = String(h.targets || '<unknown>/70%').split('/');
      var out = ['Name:                                                  ' + h.name,
        'Namespace:                                             ' + (h.ns || 'ai'),
        'Reference:                                             ' + h.ref,
        'Metrics:                                               ( current / target )',
        '  resource cpu on pods  (as a percentage of request):  ' + parts[0] + ' / ' + (parts[1] || ''),
        'Min replicas:                                          ' + h.min,
        'Max replicas:                                          ' + h.max,
        'Deployment pods:                                       ' + h.replicas + ' current / ' + h.replicas + ' desired',
        'Events:',
        '  Type     Reason             Age   From                       Message',
        '  ----     ------             ----  ----                       -------'];
      (h.events || ['  Normal   SuccessfulRescale  4m    horizontal-pod-autoscaler  New size: ' + h.replicas + '; reason: cpu resource utilization above target']).forEach(function (e) {
        out.push(e);
      });
      return out.join('\n');
    }
    if (!list.length) return 'No resources found in ai namespace.';
    var head = 'NAME          REFERENCE                   TARGETS           MINPODS   MAXPODS   REPLICAS   AGE';
    return [head].concat(list.map(function (h) {
      return padR(h.name, 14) + padR(h.ref, 28) + padR(h.targets || '<unknown>/70%', 18) +
        padR(h.min, 10) + padR(h.max, 10) + padR(h.replicas, 11) + '6d';
    })).join('\n');
  }

  function topText(w) {
    var head = 'NAME            CPU(cores)   MEMORY(bytes)';
    return [head].concat(w.pods.map(function (p) {
      return padR(p.name, 16) + padR(p.cpu || '120m', 13) + (p.mem || '1.2Gi');
    })).join('\n');
  }

  var HELP = [
    '可用命令（输入 help 随时回来看）：',
    '',
    '  nvidia-smi                 卡、显存、利用率、温度、功耗',
    '  nvidia-smi -L              列出 GPU 与 UUID',
    '  nvidia-smi -q              详细查询：ECC、retired pages、PCIe 链路',
    '  nvidia-smi nvlink -e       NVLink 每条链路的 CRC 计数',
    '  nvidia-smi topo -m         卡与卡、卡与网卡的关系码',
    '  lspci -tv                  PCIe 树的形状与链路宽度',
    '  lscpu / numactl -H         NUMA 节点与 CPU 分布',
    '  ibstat                     IB 设备与端口状态',
    '  dmesg                      内核日志（XID 都在这里）',
    '  free -h / uptime           内存与负载',
    '  kubectl get pods           Pod 状态',
    '  kubectl describe pod X     Pod 事件',
    '  etcdctl endpoint status    控制面落盘延迟',
    '  cat /proc/interrupts       中断落在哪些核',
    '  lsmod | grep nvidia        内核模块加载情况（peermem 在不在这）',
    '',
    '  —— 带外与监控：L0 的电力散热、L5 的成本与推理看这里 ——',
    '  ipmitool sdr               带外传感器：进风温度、风扇、每颗 PSU 的实际功率',
    '  ipmitool sel list          带外事件日志：掉电、过温、风扇、冗余丢失',
    "  prom query '<表达式>'      Prometheus 即时查询（封装了 HTTP API 的小工具）",
    "                             例：prom query 'pdu_current_a{rack=\"A01\"}' / prom query 'avg(gpu_util_pct)'",
    '  bill report --team nlp     账单：卡时、有效算力、闲置成本',
    '  kubectl get hpa            HPA 的当前目标值（TARGETS 是 unknown 就要查）',
    '  kubectl top pods           容器 CPU / 内存实际用量',
    '  clear                      清屏',
    '',
    '先用命令取证，再回左边选项。凡是题面已经给了结论的，命令行里都能找到对应的一行。'
  ].join('\n');

  function exec(raw, world) {
    world = ensureWorld(world);
    var cmd = String(raw || '').trim().replace(/\s+/g, ' ');
    if (!cmd) return { text: '', clear: false };
    var low = cmd.toLowerCase();

    if (low === 'help' || low === '?') return { text: HELP };
    if (low === 'clear') return { text: '', clear: true };

    if (low === 'nvidia-smi') return { text: smiTable(world) };
    if (low === 'nvidia-smi -l') return { text: smiList(world) };
    if (low === 'nvidia-smi -q') return { text: smiQuery(world) };
    if (/^nvidia-smi -q -i \d+$/.test(low)) {
      var idx = Number(low.split(' ').pop());
      var one = JSON.parse(JSON.stringify(world));
      one.gpus = world.gpus.filter(function (g) { return g.idx === idx; });
      return { text: smiQuery(one) };
    }
    if (low === 'nvidia-smi nvlink -e') return { text: nvlinkErr(world) };
    if (low === 'nvidia-smi topo -m' || low === 'topo') return { text: topoText(world) };
    if (low === 'lspci -tv' || low === 'lspci') return { text: lspciText(world) };
    if (low === 'lscpu') return { text: lscpuText(world) };
    if (low === 'numactl -h' || low === 'numactl --hardware') return { text: numactlText(world) };
    if (low === 'ibstat' || low === 'ibv_devinfo') return { text: ibstatText(world) };
    if (low === 'dmesg' || low === 'dmesg | grep -i xid' || low === 'dmesg | grep xid') return { text: dmesgText(world) };
    if (low === 'free -h' || low === 'free') return { text: freeText(world) };
    if (low === 'uptime') return { text: ' 14:10:03 up 41 days,  3:12,  2 users,  load average: 63.21, 61.88, 60.42' };
    if (low.indexOf('kubectl') === 0) return { text: kubectlText(world, low.replace(/^kubectl\s*/, '')) };
    if (low.indexOf('etcdctl') === 0) return { text: etcdText(world) };
    if (low === 'cat /proc/interrupts') return { text: interruptsText(world) };

    /* 带外 / 监控：不经过操作系统，走 BMC 与 Prometheus */
    if (low.indexOf('ipmitool') === 0) {
      if (/sdr/.test(low)) return { text: ipmiSdrText(world) };
      if (/sel/.test(low)) return { text: ipmiSelText(world) };
      return { text: 'ipmitool: 本机只接了 sdr 与 sel。例：ipmitool sdr / ipmitool sel list' };
    }
    if (low.indexOf('prom ') === 0) {
      var expr = cmd.replace(/^prom\s+/i, '').replace(/^query\b\s*/i, '').trim();
      if (!expr) return { text: "prom: 用法 prom query '<表达式>'，例 prom query 'gpu_util_pct'" };
      return { text: promText(world, expr) };
    }
    if (low === 'prom') return { text: "prom: 用法 prom query '<表达式>'，例 prom query 'gpu_util_pct'" };
    if (low.indexOf('bill') === 0) return { text: billText(world, cmd) };
    if (low.indexOf('lsmod') === 0) {
      var filt = null;
      var gm = low.match(/grep\s+(\S+)/);
      if (gm) filt = gm[1];
      var txt = lsmodText(world, filt);
      return { text: txt || '# 没有匹配的模块' };
    }

    if (/^nvidia-smi/.test(low)) {
      return { text: 'nvidia-smi: 不支持的参数「' + cmd + '」。试 help。' };
    }
    return { text: 'bash: ' + cmd.split(' ')[0] + ': command not found' };
  }

  /* 给某一关解析现场：优先用关卡自带，其次用 M03 的模型，最后退到参考机型 */
  function worldFor(scen) {
    if (!scen) return referenceWorld();
    if (scen.world) return applyOverrides(referenceWorld(), scen.world);
    if (scen.machine) return fromConfig(scen.machine);
    return referenceWorld();
  }

  /*
    入口兜底：任何一条命令都不该因为"现场缺一块"而抛异常。
    缺的字段从参考机型补，补的是结构不是数值——不改变案卷声明的任何数据。
  */
  function ensureWorld(w) {
    if (!w || typeof w !== 'object') return referenceWorld();
    var base = referenceWorld();
    ['gpus', 'nics', 'numa', 'pods', 'hpa', 'kernel'].forEach(function (k) {
      if (!Array.isArray(w[k])) w[k] = base[k];
    });
    ['etcd', 'mem', 'driver', 'cuda', 'host', 'kind'].forEach(function (k) {
      if (w[k] === undefined || w[k] === null) w[k] = base[k];
    });
    if (!w.mon || typeof w.mon !== 'object') {
      w.mon = base.mon;
    } else {
      if (!w.mon.bmc) w.mon.bmc = base.mon.bmc;
      if (!w.mon.rack) w.mon.rack = base.mon.rack;
      if (!w.mon.bill) w.mon.bill = base.mon.bill;
      if (!w.mon.metrics || typeof w.mon.metrics !== 'object') w.mon.metrics = base.mon.metrics;
    }
    return w;
  }

  function banner(world) {
    if (world.kind === 'model') {
      return '已连接到 ' + world.host + '（本关的真实现场，矩阵与 lspci 由题目配置生成）\n输入 help 看命令，回车执行。';
    }
    if (world.kind === 'scene') {
      return '已连接到 ' + world.host + '（本关的现场）\n' +
        (world.mon && world.mon.custom
          ? '本卷有一部分证据在带外与监控里：ipmitool sdr / ipmitool sel list / prom query / bill report。\n'
          : '') +
        '输入 help 看命令，回车执行。';
    }
    return '已连接到 ' + world.host + '\n' +
      '注意：本关没有专属机器现场，下面是参考机型（8 卡 H100）的输出，只能用来对照格式，不是题里的那台。\n' +
      '输入 help 看命令。';
  }

  root.TopoConsole = {
    exec: exec,
    worldFor: worldFor,
    banner: banner,
    referenceWorld: referenceWorld,
    HELP: HELP
  };

  if (typeof module === 'object' && module.exports) module.exports = root.TopoConsole;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
(function (root) {
  'use strict';

  var M = root.TopoModel;

  /*
    X2 故障注入台。
    每个案子是三层：
      现象（作业日志 / 告警 / 监控摘要）→ 取证（X1 终端）→ 根因 + 处置
    判定分两段：根因错 = 0；根因对但处置错 = 半分；两段都对 = 满分。
    理由：查得出来和修得对，是两种能力，不该混成一个对勾。
  */

  function cfgNoNvlink(seed) {
    var cfg = M.generateMachine(seed, 2);
    cfg.nvlink = { enabled: false, links: 0 };
    return cfg;
  }

  function cfgNicsOneNuma(seed) {
    var cfg = M.generateMachine(seed, 2);
    cfg.devices.NIC0.parent = 'S0';
    cfg.devices.NIC1.parent = 'S0';
    return cfg;
  }

  var CASES = [
    {
      id: 'F01',
      plane: 'L1',
      title: '一台机器上的卡少了一张',
      symptom: [
