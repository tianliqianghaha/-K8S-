<script>
(function (root) {
  'use strict';

  /*
    X3 能力雷达的计算层。
    只做一件事：把 progress 里的原始记录，算成"每个平面一行"的数字。
    不碰 DOM，方便单测。
  */

  function recKey(modId, stage) { return modId + ':' + stage; }

  function compute(data) {
    var REG = root.TopoRegistry;
    var d = data || root.TopoProgress.read();
    var mods = d.modules || {};
    var planes = REG.planes();

    var out = planes.map(function (p) {
      var total = 0, done = 0, firstTry = 0, tries = 0, passes = 0;
      p.modules.forEach(function (m) {
        if (!m.live) return;
        m.live.stageKeys.forEach(function (sk) {
          total++;
          var rec = mods[recKey(m.id, sk)];
          if (!rec) return;
          tries += rec.tries || 0;
          passes += rec.ok || 0;
          if ((rec.ok || 0) > 0) {
            done++;
            if (rec.tries === 1 && rec.ok === 1) firstTry++;
          }
        });
      });
      var coverage = total ? done / total : 0;
      var quality = done ? firstTry / done : 0;
      return {
        key: p.key,
        name: p.name,
        note: p.note,
        total: total,
        done: done,
        firstTry: firstTry,
        tries: tries,
        passes: passes,
        coverage: coverage,
        quality: quality,
        /* 掌握度：通关占七成，一次过占三成。没通关就是 0，避免"乱点也算会" */
        mastery: Math.round(coverage * 70 + quality * 30 * (done ? 1 : 0)),
        untouched: total - done
      };
    });

    var totalStages = out.reduce(function (a, b) { return a + b.total; }, 0);
    var doneStages = out.reduce(function (a, b) { return a + b.done; }, 0);
    var firstTryAll = out.reduce(function (a, b) { return a + b.firstTry; }, 0);
    var triesAll = out.reduce(function (a, b) { return a + b.tries; }, 0);

    /* 推荐下一步：先补最弱的平面里有"没通关"的模块；全通关后转为"复练正确率最低" */
    var next = null;
    var candidates = out.filter(function (p) { return p.untouched > 0; });
    if (candidates.length) {
      candidates.sort(function (a, b) { return a.mastery - b.mastery; });
      var weak = candidates[0];
      var plane = planes.filter(function (p) { return p.key === weak.key; })[0];
      for (var i = 0; i < plane.modules.length; i++) {
        var m = plane.modules[i];
        if (!m.live) continue;
        var pending = m.live.stageKeys.filter(function (sk) {
          var rec = mods[recKey(m.id, sk)];
          return !rec || !rec.ok;
        });
        if (pending.length) {
          next = {
            moduleId: m.id,
            stage: pending[0],
            plane: weak.key,
            title: m.title,
            reason: weak.key + ' 这一层还有 ' + weak.untouched + ' 关没通，掌握度 ' + weak.mastery + '%'
          };
          break;
        }
      }
    } else if (doneStages) {
      var low = out.slice().sort(function (a, b) { return a.quality - b.quality; })[0];
      next = {
        moduleId: null,
        stage: null,
        plane: low.key,
        title: low.name,
        reason: '全部通关，但 ' + low.key + ' 的"一次过率"只有 ' + Math.round(low.quality * 100) + '%，值得重刷'
      };
    }

    /*
      X2 的失败记录不进错题本：它是实验室会话，没有"模块/关卡"这层结构，
      硬塞进来会出现 plane 为空、链接拼成 #//X2/... 的坏行。
    */
    var wrong = (d.wrong || []).filter(function (w) {
      return !!REG.get(w.moduleId);
    }).slice(-12).reverse().map(function (w) {
      var m = REG.get(w.moduleId);
      var stage = null;
      m.stages.forEach(function (s) { if (s.key === w.stage) stage = s; });
      return {
        at: w.at,
        moduleId: w.moduleId,
        stage: w.stage,
        moduleTitle: m.title,
        stageTitle: stage ? stage.title : w.stage,
        plane: m.plane
      };
    });

    return {
      planes: out,
      overall: {
        total: totalStages,
        done: doneStages,
        firstTry: firstTryAll,
        tries: triesAll,
        coverage: totalStages ? doneStages / totalStages : 0,
        mastery: totalStages
          ? Math.round(doneStages / totalStages * 70 + (doneStages ? firstTryAll / doneStages : 0) * 30)
          : 0
      },
      wrong: wrong,
      next: next,
      empty: doneStages === 0
    };
  }

  root.TopoAbility = { compute: compute, recKey: recKey };

  if (typeof module === 'object' && module.exports) module.exports = root.TopoAbility;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

(function (root) {

<script>
(function (root) {
  'use strict';

  var M = root.TopoModel;
  var PL = root.TopoPlace;

  function devMeta(cfg, id) {
    var d = cfg.devices[id];
    if (!d) return '';
    if (d.type === 'gpu') return d.mem ? Math.round(d.mem / 1024) + 'GB' : '';
    if (d.type === 'nic') return d.speed ? d.speed + 'G' : '';

  }

  var TYPE_LABEL = { cpu: 'CPU', bridge: 'PCIe 桥', switch: '交换芯片', gpu: 'GPU', nic: '网卡' };

  function mount(el, ctx) {
    var cfg = ctx.config;

    function reachable() {
      var set = {};
      function walk(host) {
        Object.keys(cfg.switches).forEach(function (s) {
          if (cfg.switches[s] === host && !set[s]) { set[s] = 1; walk(s); }
        });
        Object.keys(cfg.devices).forEach(function (d) {
          if (cfg.devices[d].parent === host) set[d] = 1;
        });
      }
      Object.keys(cfg.cpuPlacement).forEach(function (c) {
        if (cfg.cpuPlacement[c] === null) return;
        set[c] = 1;
        Object.keys(cfg.bridges).forEach(function (b) {
          if (cfg.bridges[b] === c && !set[b]) { set[b] = 1; walk(b); }
        });
      });
      return set;
    }

    function zoneCls(kind, params) {
      if (!sel) return 'bd-zone';
      var ok = PL.check(cfg, sel, {
        kind: kind, numa: params.numa, cpu: params.cpu, host: params.host
      }).ok;
      return ok ? 'bd-zone ok' : 'bd-zone';
    }

    function zone(kind, params, label) {
      var ds = ['data-zone="' + kind + '"'];
      Object.keys(params).forEach(function (k) {
        if (params[k] !== undefined && params[k] !== null) ds.push('data-' + k + '="' + params[k] + '"');
      });
      return '<div class="' + zoneCls(kind, params) + '" ' + ds.join(' ') + '>' + label + '</div>';

        '<span class="bd-id">' + id + '</span>' +
        (extra ? '<span class="bd-meta">' + extra + '</span>' : '') +
        '</div>';

    function kidsHtml(host) {
      var sws = Object.keys(cfg.switches).filter(function (s) { return cfg.switches[s] === host; });
      var devs = Object.keys(cfg.devices).filter(function (d) { return cfg.devices[d].parent === host; });
      if (!sws.length && !devs.length) return '';

      devs.forEach(function (d) { out.push(card(d, cfg.devices[d].type, devMeta(cfg, d))); });
      sws.forEach(function (s) {
        out.push('<div class="bd-sw">' + card(s, 'switch') +
          zone('under', { host: s }, '拖交换芯片 / 设备到这里') +

      if (!list.length) return '';

          zone('under', { host: b }, '拖交换芯片 / 设备到这里') +

    }

    function cpuAt(n) {
      var found = null;
      Object.keys(cfg.cpuPlacement).forEach(function (c) {
        if (cfg.cpuPlacement[c] === n) found = c;

    }

    function boardHtml() {

          out.push(bridgesHtml(cpu));

      out.push('</div>');

    function trayHtml() {

          (p.type === 'gpu' || p.type === 'nic' ? '<span class="bd-meta">' + devMeta(cfg, p.id) + '</span>' : '') +
          '</div>';

        '<div class="bd-tray-h">未放置的零件（' + items.length + '）—— 拖回这里可以取下</div>' +
        '<div class="bd-tray">' + (body || '<span class="bd-empty">全部就位</span>') + '</div>' +
        '</div>';
    }

(function (root) {
  'use strict';

  function mount(el, ctx) {
    var items = ctx.items || [];
    var order = (ctx.start || items.map(function (x) { return x.id; })).slice();
    var sel = null;

    function labelOf(id) {
      var it = items.filter(function (x) { return x.id === id; })[0];
      return it ? it.label : id;
    }

    function render() {
      el.innerHTML = '<div class="st">' + order.map(function (id, i) {
        return '<div class="st-row' + (sel === id ? ' sel' : '') + '" data-id="' + id + '">' +
          '<span class="st-n">' + (i + 1) + '</span>' +
          '<span class="st-t">' + labelOf(id) + '</span>' +
          '<span class="st-btns">' +
          '<button class="st-b" data-act="up" data-id="' + id + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button class="st-b" data-act="down" data-id="' + id + '"' + (i === order.length - 1 ? ' disabled' : '') + '>↓</button>' +
          '</span></div>';
      }).join('') + '</div>' +
        '<div class="st-tip">点两行可以直接交换；也可以按 ↑ ↓ 一格格挪。</div>';
    }

    function move(id, dir) {
      var i = order.indexOf(id);
      var j = i + dir;
      if (i < 0 || j < 0 || j >= order.length) return;
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }

    el.addEventListener('click', function (e) {
      var btn = e.target.closest('.st-b');
      if (btn) {
        move(btn.getAttribute('data-id'), btn.getAttribute('data-act') === 'up' ? -1 : 1);
        sel = null;
        render();
        if (ctx.onChange) ctx.onChange();
        return;
      }
      var row = e.target.closest('.st-row');
      if (!row) return;
      var id = row.getAttribute('data-id');
      if (sel === null) { sel = id; render(); return; }
      if (sel === id) { sel = null; render(); return; }
      var a = order.indexOf(sel), b = order.indexOf(id);
      var t = order[a]; order[a] = order[b]; order[b] = t;
      sel = null;
      render();
      if (ctx.onChange) ctx.onChange();
    });

    render();

    return {
      refresh: function (next) {
        if (next) order = next.slice();
        sel = null;
        render();
      },
      answer: function () { return { order: order.slice() }; }
    };
  }

  root.TopoRenderSort = { mount: mount };

  if (typeof module === 'object' && module.exports) module.exports = root.TopoRenderSort;

<script>
(function (root) {
  'use strict';

  function mount(el, ctx) {
    var left = ctx.left || [];
    var right = ctx.right || [];
    var rightOrder = (ctx.rightOrder || right.map(function (x) { return x.id; })).slice();
    var pairs = {};
    var sel = null;

    function labelOf(list, id) {
      var it = list.filter(function (x) { return x.id === id; })[0];
      return it ? it.label : id;
    }

    function render() {
      var rightHtml = rightOrder.map(function (rid) {
        var bound = null;
        Object.keys(pairs).forEach(function (lid) { if (pairs[lid] === rid) bound = lid; });
        return '<div class="mt-item mt-right' + (bound ? ' bound' : '') + '" data-side="r" data-id="' + rid + '">' +
          '<span class="mt-t">' + labelOf(right, rid) + '</span>' +
          (bound ? '<span class="mt-badge">' + labelOf(left, bound) + '</span>' : '') +
          '</div>';
      }).join('');

      var leftHtml = left.map(function (l) {
        return '<div class="mt-item mt-left' + (sel === l.id ? ' sel' : '') + (pairs[l.id] ? ' bound' : '') +
          '" data-side="l" data-id="' + l.id + '">' +
          '<span class="mt-t">' + l.label + '</span>' +
          (pairs[l.id] ? '<span class="mt-badge">' + labelOf(right, pairs[l.id]) + '</span>' : '') +
          '</div>';
      }).join('');

      el.innerHTML = '<div class="mt"><div class="mt-col">' + leftHtml + '</div>' +
        '<div class="mt-col">' + rightHtml + '</div></div>' +
        '<div class="mt-tip">' + (sel ? '已选中左边一项，去右边点它对应的那一项。' : '先点左边，再点右边。再点一次左边可以取消。') + '</div>';
    }

    el.addEventListener('click', function (e) {
      var it = e.target.closest('.mt-item');
      if (!it) return;
      var id = it.getAttribute('data-id');
      if (it.getAttribute('data-side') === 'l') {
        if (sel === id) { sel = null; delete pairs[id]; }
        else sel = id;
        render();
        if (ctx.onChange) ctx.onChange();
        return;
      }
      if (!sel) return;
      /* 右边被别的左项占了，先解绑 */
      Object.keys(pairs).forEach(function (lid) { if (pairs[lid] === id) delete pairs[lid]; });
      pairs[sel] = id;
      sel = null;
      render();
      if (ctx.onChange) ctx.onChange();
    });

    render();

    return {
      refresh: function () { sel = null; render(); },
      answer: function () {
        var p = {};
        Object.keys(pairs).forEach(function (k) { p[k] = pairs[k]; });
        return { pairs: p };
      }
    };
  }

  root.TopoRenderMatch = { mount: mount };

  if (typeof module === 'object' && module.exports) module.exports = root.TopoRenderMatch;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
(function (root) {

  function esc(s) {

  function genA(seed, opts) {

      seed: seed,
      hard: hard,
      machine: machine,
      player: M.blankConfig(machine),
      matrix: M.buildMatrix(machine),

      topoLegend: parts.legend,

      lscpu: M.formatLscpu(machine)

  }

  function promptA(scen) {
    return {
      tabs: [
        {
          name: 'nvidia-smi topo -m',
          html: '<pre class="tpre">' + esc(scen.topoTable) + '</pre>' +
            '<div class="tleg">' + esc(scen.topoLegend) + '</div>'

        '卡片上的 <b>PIX / PXB / PHB / NODE / SYS</b> 说的是远近，不是型号。'

    }
    var pm = M.buildMatrix(ans.config);
    var diffs = M.compareMatrix(scen.matrix, pm);
    var items = diffs.slice(0, 6).map(function (d) {
      var exp = M.codeInfo(d.expected);
      var act = M.codeInfo(d.actual);
      return {
        tone: 'bad',
        title: d.a + ' ↔ ' + d.b + '：你摆成了 ' + d.actual + '，应该是 ' + d.expected,
        text: '差在【' + exp.layer + '】。' + act.short + '，而题目要求「' + exp.short + '」。' + exp.why
      };
    });
    if (diffs.length > 6) {
      items.push({
        tone: 'bad',

      });

    var placed = PL.countPlaced(ans.config);

    var head = diffs.length === 0

      : '还有 ' + diffs.length + ' 对关系对不上（已放置 ' + placed + ' / ' + total + ' 个零件）。';

      (pa.switchPath.length ? ' / 交换芯片 ' + pa.switchPath.join(' → ') : '（直连桥，不经过交换芯片）') +

  function sideA(scen, ans) {
    var pm = M.buildMatrix(ans.config);
    var placed = PL.countPlaced(ans.config);
    var total = M.allParts(ans.config).length;
    return '<div class="side-h">你的拓扑表 · 实时反算</div>' +
      '<div class="side-sub">已放置 ' + placed + ' / ' + total + ' 个零件</div>' +
      '<div class="mx-wrap">' + root.TopoRenderMatrix.html(pm, { compact: true }) + '</div>' +
      '<div class="mx-note">同一个交换芯片下 = PIX；过一层桥 = PXB；一方直连 CPU = PHB；同 NUMA 不同桥 = NODE；跨 NUMA = SYS。</div>';
  }

  function solveA(scen) {
    return { config: JSON.parse(JSON.stringify(scen.machine)) };
  }

  /* =====================  s2 · C 计算  ===================== */

  function genC(seed) {
    var r = R.stream(seed, 'M03.calc');
    var kind = r.int(3);
    var S = kind === 2 ? r.pick([6, 12, 24, 48]) : r.pick([4, 8, 16, 64]);
    var q, expected, steps;

    if (kind === 0) {
      expected = S / 32 * 1000;
      q = '一条 PCIe 5.0 x16 链路，把 ' + S + ' GB 数据从一张 GPU 搬到同一颗交换芯片下的网卡。' +
        '链路单向带宽 32 GB/s，忽略协议开销。需要多少毫秒？';
      steps = ['单向带宽 = 32 GB/s（Gen5 x16 双向 64，单向砍半）',
        '耗时 = ' + S + ' GB ÷ 32 GB/s = ' + G.round(S / 32, 4) + ' s',
        '换算 = ' + G.round(S / 32, 3) + ' × 1000 = ' + G.round(expected, 1) + ' ms'];
    } else if (kind === 1) {
      expected = S / 16 * 1000;
      q = '同一张卡，PCIe 链路协商结果从 Gen5 x16 掉到了 Gen4 x16（单向 16 GB/s），' +
        '传输 ' + S + ' GB 需要多少毫秒？';
      steps = ['Gen4 x16 单向 = 16 GB/s（Gen5 的一半）',
        '耗时 = ' + S + ' ÷ 16 = ' + G.round(S / 16, 4) + ' s',
        '换算 = ' + G.round(expected, 1) + ' ms'];
    } else {
      expected = (S / 12 - S / 32) * 1000;
      q = '两张 GPU 各发 ' + S + ' GB 到网卡：GPU0 与网卡在同一颗交换芯片下（32 GB/s），' +
        'GPU4 与网卡跨 NUMA（实测 12 GB/s）。两条流同时开始，各自跑完的耗时差多少毫秒？';
      steps = ['同芯片：' + S + ' ÷ 32 = ' + G.round(S / 32, 3) + ' s',
        '跨 NUMA：' + S + ' ÷ 12 = ' + G.round(S / 12, 3) + ' s',
        '差值 = ' + G.round(S / 12 - S / 32, 3) + ' s = ' + G.round(expected, 1) + ' ms'];
    }

    return {
      seed: seed, kind: kind, size: S, question: q, q: q,
      expected: expected, steps: steps,
      fields: [{ key: 't', label: '需要', unit: 'ms', ph: '填数字' }],
      unit: 'ms',
    };
  }

  function promptC(scen) {
    return {
      tabs: [{ name: '题目', text: scen.question }],
      note: '只填数字，单位已经给好。所有参数都在题面里，不靠背——但要小心带宽口径。'
    };
  }

  function judgeC(scen, ans) {
    var v = ans.t;
    var ok = G.near(v, scen.expected, 0.005);
    var items = [];
    if (!ok && isFinite(v)) {
      if (G.near(v, scen.expected / 2, 0.02)) {
        items.push({
          tone: 'warn', title: '差得很有规律：正好一半',
          text: '你把 Gen5 x16 的双向 64 GB/s 当成了单向。链路带宽一律用单向值：Gen5 x16 = 32 GB/s。'
        });
      } else if (G.near(v, scen.expected * 2, 0.02)) {
        items.push({
          tone: 'warn', title: '差得很有规律：正好两倍',
          text: '你用的带宽只有应有的一半。Gen5 x16 单向是 32 GB/s，Gen4 x16 才是 16 GB/s。'
        });
      } else if (G.near(v, scen.expected / 1000, 0.02)) {
        items.push({ tone: 'warn', title: '数量级差 1000 倍', text: '你算出来的是秒，题目要毫秒。' });
      } else if (G.near(v, scen.expected * 1000, 0.02)) {
        items.push({ tone: 'warn', title: '数量级差 1000 倍', text: '你多乘了一次 1000，题目要毫秒。' });
      }
    }
    items.push({
      tone: ok ? 'ok' : 'info',
      title: '标准答案 ' + G.round(scen.expected, 1) + ' ms',
      text: scen.steps.map(function (s, i) { return (i + 1) + '. ' + s; }).join('<br>')
    });
    if (!isFinite(v)) {
      return { ok: false, score: 0, head: '还没填数字。', items: items };
    }
    return {
      ok: ok, score: ok ? 1 : 0,
      head: ok ? '算对了。' : ('你填的是 ' + v + ' ms，标准答案 ' + G.round(scen.expected, 1) + ' ms。'),
      items: items
    };
  }

  function hintC(scen, ans, lv) {
    if (lv <= 0) return '先确认单位：这里一律用单向带宽。Gen5 x16 单向 32 GB/s，双向 64 GB/s。';
    if (lv === 1) return '耗时 = 数据量 ÷ 带宽，得到的是秒；题目要毫秒，记得乘 1000。';
    return '把数字代进去：' + scen.steps[1] + ' → ' + scen.steps[2];
  }

  function sideC(scen, ans, res) {

  /* =====================  s3 · B 诊断  ===================== */

  var CASES = [

        { label: 'PCIe 从 Gen5 掉到了 Gen1', detail: '链路训练失败', why: '不成立。掉代会同时影响所有链路，不会出现同机一半 24 GB/s、一半 12 GB/s 的分裂。' }

    {

        'GPU1    PIX      X      PIX\n' +
        'NIC0    PIX     PIX      X',
      p2p: 'Device to Device Bandwidth (GB/s), 3 devices\n' +
        '        GPU0    GPU1    NIC0\n' +

        { label: '两张卡跨了 NUMA', detail: 'NUMA 亲和没配对', why: '不成立。矩阵明确是 PIX，说明在同一个交换芯片、同一个 NUMA 下，不存在跨 UPI。' },
        { label: 'NVLink 没起来', detail: 'fabricmanager 未启动', why: '不成立。这台机器本来就没有 NVLink；就算有，NVLink 缺失会让 GPU 之间显示 SYS 或 PHB，不会显示 PIX。' },
        { label: '显存 ECC 打开了', detail: 'ECC 占用带宽', why: '不成立。ECC 对带宽的影响是个位数百分比，不可能掉到八分之一。' }
      ],
      answer: 0
    },
    {

      p2p: 'Device to Device Bandwidth (GB/s), 4 devices\n' +
        '        GPU0    GPU1    NIC0    NIC1\n' +
        'GPU0    0.00    24.66   24.70   11.98\n' +
        'GPU1    24.64   0.00    24.68   12.01\n' +
        'NIC0    24.69   24.67   0.00    12.03\n' +
        'NIC1    11.97   12.00   12.04   0.00',
      symptom: '单机 P2P 全部达标，矩阵也是 PIX，但整机训练吞吐只有同型号基线的 60%。',
      options: [
        { label: '瓶颈不在 P2P：去查网卡与 NUMA 的绑定、NCCL 实际选了哪张卡', detail: '算力侧或网卡侧', why: '正确。P2P 达标只证明卡到卡没问题。训练吞吐由最弱的一环决定：网卡绑错 NUMA、NCCL_IB_HCA 选错、或者计算侧本身就是瓶颈，都会让整体掉到 60% 而 P2P 依然漂亮。' },
        { label: 'PCIe 拓扑摆错了', detail: '层级不对', why: '不成立。矩阵是题目直接给出的，PIX 表示已经是同芯片最优路径。' },
        { label: '需要打开 GPU 之间的 NVLink', detail: '走专线更快', why: '不成立。GPU 与网卡之间没有 NVLink；NVLink 只解决 GPU 之间。' },
        { label: '主板 PCIe 代数不够，要换 Gen5 主板', detail: '链路代际', why: '不成立。24.7 GB/s 已经是 Gen5 x16 的正常量级，换主板不会有收益。' }
      ],

    },

        'GPU1    PIX      X      PHB\n' +

        'NIC0    12.40   12.39   0.00',
      symptom: '同一台机器，卡和卡之间 24 GB/s，卡和网卡之间却只有一半。',
      options: [
        { label: '网卡直连 CPU 根端口，中间过了一次 Host Bridge', detail: '没有经过交换芯片', why: '正确。PHB 表示一方直接挂在 CPU 的 PCIe 根端口上，路径必须穿过 Host Bridge，带宽约为同芯片的六到七成，这里是 12.4 GB/s。' },
        { label: '网卡和 GPU 跨了 NUMA', detail: '跨越两颗 CPU', why: '不成立。PHB 的前提就是同 NUMA；跨 NUMA 会显示 SYS，而且带宽会更低。' },
        { label: '交换芯片坏了，链路降级', detail: '硬件故障', why: '不成立。这一对之间根本没有交换芯片参与，路径是设备直连根端口。' },
        { label: '网卡是 100G 版本', detail: '网口速率不足', why: '不成立。12.4 GB/s 是 P2P 内存拷贝带宽，跟网口速率无关；而且卡到卡 24 GB/s 说明 PCIe 侧没问题。' }
      ],
      answer: 0
    }
  ];

  function genB(seed) {
    var r = R.stream(seed, 'M03.diag');
    var c = CASES[r.int(CASES.length)];
    return {
      seed: seed,
      key: c.key,
      question: c.title,
      topo: c.topo,
      p2p: c.p2p,
      symptom: c.symptom,
      options: c.options,
      answer: c.answer
    };
  }

  function promptB(scen) {
    return {
      tabs: [
        { name: 'nvidia-smi topo -m', text: scen.topo },
        { name: 'p2pBandwidthLatencyTest', text: scen.p2p },
        { name: '现象', text: scen.symptom }
      ],
      note: '三样东西一起看：拓扑表说"可能有多快"，P2P 实测说"实际多快"，现象说"业务受多大影响"。' +
        '只有表和实测<b>对不上</b>的时候，才是链路层的问题。'
    };
  }

  function judgeB(scen, ans) {
    var pick = ans.pick;
    if (pick === null || pick === undefined) {
      return { ok: false, score: 0, head: '还没选。', items: [] };
    }
    var ok = pick === scen.answer;
    var chosen = scen.options[pick];
    var right = scen.options[scen.answer];
    var items = [{
      tone: ok ? 'ok' : 'bad',
      title: (ok ? '选对了：' : '选错了：') + chosen.label,
      text: chosen.why
    }];
    if (!ok) {
      items.push({
        tone: 'info',
        title: '正确答案是 ' + String.fromCharCode(65 + scen.answer) + '：' + right.label,
        text: right.why
      });
    }
    return {
      ok: ok, score: ok ? 1 : 0,
      head: ok ? '根因判断正确。' : '根因判断错了，看看为什么这一项解释不了现象。',
      items: items
    };
  }

  function hintB(scen, ans, lv) {
    if (lv <= 0) return '先做一件事：把拓扑表的码和 P2P 的数字对上。表说 PIX 就该有 24 GB/s 以上，表说 SYS 就该掉到 10 GB/s 左右。';
    if (lv === 1) {
      var has = scen.topo.indexOf('SYS') >= 0;
      return has ? '这张表里出现了 SYS —— 想想 SYS 的物理含义，数据要从哪过。'
        : '这张表里没有 SYS，全是 PIX 或 PHB。那 P2P 慢就不是"离得远"，而是"被拦住了"。';
    }
    return '排除法：四个选项里有三个和你看到的现象不自洽（带宽量级、影响范围、是否全员一致）。';
  }

  function sideB(scen, ans, res) {
    return '<div class="side-h">读表的顺序</div>' +
      '<div class="steps"><div>1 看对角线两侧有没有 SYS</div>' +
      '<div>2 看有没有 PHB（直连根端口）</div>' +
      '<div>3 把码换算成预期带宽，和实测比</div>' +
      '<div>4 表和实测一致 → 瓶颈不在链路层</div></div>' +
      '<div class="mx-note">这一关考的不是记性，是"能不能用表否掉三个选项"。</div>';
  }

  function solveB(scen) { return { pick: scen.answer }; }

  /* =====================  s4 · D 决策  ===================== */

  function buildD(nic0, nic1) {
    var cfg = {
      seed: 0, level: 1,
      cpuPlacement: { CPU0: 0, CPU1: 1 },
      bridges: { B0: 'CPU0', B1: 'CPU0', B2: 'CPU1', B3: 'CPU1' },
      switches: { S0: 'B0', S2: 'B2', S3: 'B2' },
      devices: {},
      nvlink: { enabled: false, links: 0 },
      meta: { gpuCount: 8, cpuCount: 2, level: 1, nicMode: 'decision' }
    };
    for (var i = 0; i < 8; i++) {
      cfg.devices['GPU' + i] = {
        type: 'gpu', parent: i < 4 ? 'S0' : 'S2', mem: 81920, power: 700
      };
    }
    cfg.devices.NIC0 = { type: 'nic', parent: nic0, speed: 400 };
    cfg.devices.NIC1 = { type: 'nic', parent: nic1, speed: 400 };
    return cfg;
  }

  /*
    每张 GPU 都走"对它最划算"的那张网卡——调度器会这么选，
    所以判分也应该按最优分配算，而不是按"最后一张同 NUMA 的卡"。
  */
  function scoreD(cfg) {
    var total = 0;
    var detail = [];
    for (var i = 0; i < 8; i++) {
      var g = 'GPU' + i;
      var best = null, bestCost = Infinity;
      ['NIC0', 'NIC1'].forEach(function (n) {
        var cost = G.penalty(M.relation(cfg, g, n));
        if (cost < bestCost) { bestCost = cost; best = n; }
      });
      total += bestCost;
      detail.push({ gpu: g, nic: best, code: M.relation(cfg, g, best), cost: bestCost });
    }
    return { total: total, detail: detail };
  }

  function genD(seed) {
    var r = R.stream(seed, 'M03.decision');
    var raw = [
      {
        label: '双路对齐：两张网卡分别插在 NUMA0 / NUMA1 的交换芯片下',
        detail: '8 张卡各走本路网卡，谁都不用跨 UPI',
        cfg: buildD('S0', 'S2')
      },
      {
        label: '走线优先：NIC1 插进 NUMA1 那一路的第二颗交换芯片下',
        detail: '与 GPU4-7 同桥但不同芯片，机柜内走线短一点',
        cfg: buildD('S0', 'S3')
      },
      {
        label: '省槽位：两张网卡都插在 NUMA0 的交换芯片下',
        detail: '只占用一路 PCIe 槽，另一路留给本地盘',
        cfg: buildD('S0', 'B0')
      },
      {
        label: '直连优先：两张网卡都直插 CPU 根端口，不经过交换芯片',
        detail: '少一跳，听起来更快',
        cfg: buildD('B0', 'B2')
      }
    ];
    raw.forEach(function (o) {
      var s = scoreD(o.cfg);
      o.penalty = s.total;
      o.detailScore = s.detail;
    });
    var best = raw.reduce(function (a, b) { return a.penalty <= b.penalty ? a : b; });
    var order = r.shuffle([0, 1, 2, 3]);
    var options = order.map(function (i) { return raw[i]; });
    var answer = options.indexOf(best);

    return {
      seed: seed,
      order: order,
      options: options,
      answer: answer,
      best: best.penalty,
      machine: options[answer].cfg
    };
  }

  function promptD(scen) {
    return {
      tabs: [{
        name: '装机任务',
        text: '一台待装的双路 GPU 服务器：\n' +
          '  CPU0 —— 桥 B0、B1\n' +
          '  CPU1 —— 桥 B2、B3\n' +
          '  GPU0-3 已经挂在 CPU0 的交换芯片 S0 下\n' +
          '  GPU4-7 已经挂在 CPU1 的交换芯片 S2 下\n' +
          '  只剩两张 400G 网卡没插\n\n' +
          '任务：8 卡纯数据并行，每一步都要跨机做 all-reduce。\n' +
          '网卡插哪，决定了每张卡发出去的第一步要不要过 UPI。'
      }],
      note: '没有唯一正确的"好设计"，只有代价不同的取舍。选完会告诉你贵在哪。'
    };
  }

  function judgeD(scen, ans) {
    var pick = ans.pick;
    if (pick === null || pick === undefined) {
      return { ok: false, score: 0, head: '还没选方案。', items: [] };
    }
    var chosen = scen.options[pick];
    var bestOpt = scen.options[scen.answer];
    var res = G.byPenalty(chosen.penalty, scen.best, 8);

        { q: '压测结果只有理论值 30%，但点对点达标，先怀疑什么？', options: ['交换机', '压测客户端本身是瓶颈', '光模块', '驱动'], answer: 1, why: '单线程客户端打不满高速网络，是压测最常见的假阴性。' },
        { q: '混沌演练的爆炸半径应该怎么安排？', options: ['越大越好', '从小到大，全程可控可回滚', '随机', '只做硬件级'], answer: 1, why: '混沌工程的前提是可控，不是制造真实事故。' }
      ]).slice(0, 2);
    }
  };

  REG.declare(M25);
  REG.declare(M26);
  REG.declare(M27);

  root.M25 = M25;
  root.M26 = M26;
  root.M27 = M27;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function (root) {
  'use strict';

  var REG = root.TopoRegistry;
  var PROG = root.TopoProgress;
  var RENDERERS = {
    board: root.TopoRenderBoard,
    calc: root.TopoRenderCalc,
    choice: root.TopoRenderChoice,
    sort: root.TopoRenderSort,
    match: root.TopoRenderMatch,
    matrix: root.TopoRenderMatrix
  };

  var DEFAULT_SEED = 20261125;
  var state = {
    hard: false,
    seed: {},
    hintLv: {},
    quiz: null
  };
  var view = null;
  var history = [];
  var future = [];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* seed 与提示层级要按「模块:关卡」记，否则不同模块的 s1 会共用同一个 seed */
  function stageKeyOf(mod, stage) { return mod.id + ':' + stage.key; }

  function $(sel) { return document.querySelector(sel); }

  function toast(msg) {
    var el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ---------------- 地图页 ---------------- */

  function viewMap() {
    var planes = REG.planes().slice().reverse();
    var total = REG.CATALOG.length;
    var open = REG.CATALOG.filter(function (m) { return REG.isOpen(m.id); }).length;
    var rows = planes.map(function (p) {
      var first = p.modules[0].id;
      var last = p.modules[p.modules.length - 1].id;
      var anyOpen = p.modules.some(function (m) { return m.open; });
      return '<div class="map-row' + (anyOpen ? ' live' : '') + '" data-plane="' + p.key + '">' +
        '<div class="map-l"><b>' + p.key + '</b><span>' + p.name + '</span></div>' +
        '<div class="map-r"><em>' + first + '–' + last + '</em><span>' + p.note + '</span></div>' +
        '<div class="map-n">' + p.modules.length + ' 个模块' + (anyOpen ? ' · 可进入' : '') + '</div>' +
        '</div>';
    }).join('');

    return '<div class="page">' +
      '<div class="hero">' +
      '<h1>AI Infra 认知训练场</h1>' +
      '<p>七个平面，' + total + ' 个模块。从墙上的插座一路练到线上的 SLA。<br>' +
      '每一层只出现这一层的术语——在机柜层不谈 NVLink，在 NCCL 层不谈 U 位。</p>' +
      '<div class="hero-kpi">已开放 <b>' + open + '</b> / ' + total + ' 个模块　' +
      '<a class="hero-link" href="#/lab">故障注入台 →</a>' +
      '<a class="hero-link" href="#/ability">查看能力雷达 →</a></div>' +
      '</div>' +
      '<div class="map-note">从下往上是物理到抽象的依赖顺序，不是课程顺序</div>' +
      '<div class="map">' + rows + '</div>' +
      '<div class="map-foot">七个平面全部开放，共 28 个模块、85 关。每关过了才解锁知识卡与小测；' +
      '进度存在本地，换台机器不会同步。</div>' +
      '</div>';
  }

  /* ---------------- 平面页 ---------------- */

  function viewPlane(planeKey) {
    var plane = REG.planes().filter(function (p) { return p.key === planeKey; })[0];
    if (!plane) return viewMap();
    var cards = plane.modules.map(function (m) {
      var prog = m.open ? PROG.moduleProgress(m.id) : null;
      var cls = 'card' + (m.open ? ' live' : ' soon');
      return '<div class="' + cls + '" data-mod="' + m.id + '">' +
        '<div class="card-id">' + m.id + '</div>' +
        '<div class="card-t">' + m.title + '</div>' +
        (m.live
          ? '<div class="card-atoms">' + m.live.atoms.map(function (a) { return '<span class="atom a-' + a + '">' + a + '</span>'; }).join('') + '</div>' +
          '<div class="card-f">' + m.live.subtitle + '</div>' +
          '<div class="card-go">' + (prog && prog.done ? '已通 ' + prog.done + ' 关 →' : '进入 →') + '</div>'
          : '<div class="card-f">待开工</div><div class="card-go dim">未开放</div>') +
        '</div>';
    }).join('');

    return '<div class="page">' +
      '<div class="crumb"><a href="#/">地图</a> / ' + plane.key + '</div>' +
      '<h1 class="ph">' + plane.key + ' · ' + plane.name + '</h1>' +
      '<p class="ps">' + plane.note + '</p>' +
      '<div class="cards">' + cards + '</div>' +
      '</div>';
  }

  /* ---------------- 能力雷达 ---------------- */

  function radarSvg(planes) {
    var cx = 200, cy = 186, R = 126, n = planes.length;
    function pt(i, r) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    }
    var out = ['<svg viewBox="0 0 400 380" class="radar" role="img">'];
    [0.25, 0.5, 0.75, 1].forEach(function (k) {
      var pts = planes.map(function (_, i) {
        var q = pt(i, R * k);
        return q[0].toFixed(1) + ',' + q[1].toFixed(1);
      }).join(' ');
      out.push('<polygon points="' + pts + '" fill="none" stroke="#222b36" stroke-width="1"/>');
    });
    planes.forEach(function (p, i) {
      var e = pt(i, R);
      out.push('<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="#222b36" stroke-width="1"/>');
    });
    var vals = planes.map(function (p, i) {
      var q = pt(i, R * Math.max(0, Math.min(100, p.mastery)) / 100);
      return q[0].toFixed(1) + ',' + q[1].toFixed(1);
    }).join(' ');
    out.push('<polygon points="' + vals + '" fill="rgba(240,160,32,0.16)" stroke="#f0a020" stroke-width="1.5"/>');
    planes.forEach(function (p, i) {
      var q = pt(i, R * Math.max(0, Math.min(100, p.mastery)) / 100);
      out.push('<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="3" fill="#f0a020"/>');
      var l = pt(i, R + 20);
      var anchor = 'middle';
      if (l[0] > cx + 8) anchor = 'start';
      else if (l[0] < cx - 8) anchor = 'end';
      out.push('<text x="' + l[0].toFixed(1) + '" y="' + l[1].toFixed(1) + '" fill="#8b98a5" font-size="11" font-family="ui-monospace,monospace" text-anchor="' + anchor + '" dominant-baseline="central">' + p.key + ' ' + Math.round(p.mastery) + '</text>');
    });
    out.push('<circle cx="' + cx + '" cy="' + cy + '" r="2" fill="#3a4654"/>');
    out.push('</svg>');
    return out.join('');
  }

  function viewAbility() {
    var a = root.TopoAbility.compute();
    var rows = a.planes.slice().reverse().map(function (p) {
      var w = Math.max(0, Math.min(100, p.mastery));
      return '<div class="ab-row">' +
        '<div class="ab-k">' + p.key + '</div>' +
        '<div class="ab-n">' + p.name + '</div>' +
        '<div class="ab-bar"><i style="width:' + w + '%"></i></div>' +
        '<div class="ab-v">' + p.done + '/' + p.total + '</div>' +
        '<div class="ab-m">' + p.mastery + '%</div>' +
        '</div>';
    }).join('');

    var nextHtml = '';
    if (a.next) {
      var href = a.next.moduleId ? ('#/' + a.next.plane + '/' + a.next.moduleId + '/' + a.next.stage) : ('#/' + a.next.plane);
      nextHtml = '<div class="ab-next"><div class="ab-next-t">下一步</div>' +
        '<a class="ab-next-link" href="' + href + '">' + (a.next.moduleId ? a.next.moduleId + ' · ' + a.next.title : a.next.title) + ' →</a>' +
        '<div class="ab-next-r">' + a.next.reason + '</div></div>';
    }

    var wrongHtml = '';
    if (a.wrong.length) {
      wrongHtml = '<div class="ab-wrong"><div class="kn-h">最近没过的关</div>' + a.wrong.map(function (w) {
        var href = '#/' + w.plane + '/' + w.moduleId + '/' + w.stage;
        return '<a class="ab-w" href="' + href + '"><span class="ab-w-p">' + w.plane + '</span>' +
          '<span class="ab-w-t">' + w.moduleId + ' ' + w.moduleTitle + '</span>' +
          '<span class="ab-w-s">' + w.stageTitle + '</span></a>';
      }).join('') + '</div>';
    }

    var empty = a.empty
      ? '<div class="ab-empty">还没有记录。先去 <a href="#/L0/M00/s1">M00 · 机房与机柜</a>' +
      ' 或 <a href="#/L1/M03/s1">M03 · PCIe 拓扑</a> 玩两关，这里就有数据了。<br>' +
      '这里只统计本机玩过的关卡，不做任何推测。</div>'
      : '';

    return '<div class="page">' +
      '<div class="crumb"><a href="#/">地图</a> / 能力雷达</div>' +
      '<div class="mod-head"><div><h1 class="ph">能力雷达</h1>' +
      '<p class="ps">按七个平面统计。掌握度 = 通关率 × 70 + 一次过率 × 30。<br>' +
      '一次过指的是"第一次提交就对"，它比"反复试出来"更能说明真的会。</p></div>' +
      '<div class="mod-side"><span class="ab-kpi">通关 <b>' + a.overall.done + '</b> / ' + a.overall.total + '</span>' +
      '<span class="ab-kpi">一次过 <b>' + a.overall.firstTry + '</b></span>' +
      '<span class="ab-kpi">提交 <b>' + a.overall.tries + '</b> 次</span>' +
      '<button class="btn ghost" id="btn-reset-progress">清空本机记录</button></div></div>' +
      empty +
      '<div class="abil">' +
      '<div class="panel ab-radar">' + radarSvg(a.planes) +
      '<div class="ab-legend">越靠外越熟。七个轴分别是七个平面，从 L0 场地到 L6 故障。</div></div>' +
      '<div class="panel ab-side">' + rows + nextHtml + '</div>' +
      '</div>' +
      wrongHtml +
      '</div>';
  }

  /* ---------------- X2 故障注入台 ---------------- */

  var labState = { c: null, cause: null, fix: null, seed: 0 };

  function labSolved() {
    var d = PROG.read();
    return Object.keys(d.modules || {}).filter(function (k) {
      return k.indexOf('X2:') === 0 && d.modules[k].ok > 0;
    }).length;
  }

  function labOpen(seed) {
    labState.seed = seed;
    labState.c = root.TopoLab.pick(seed);
    labState.cause = null;
    labState.fix = null;
  }

  /* 深链：#/lab/F19 直接打开某一卷，方便讲解和复核 */
  function labOpenById(id) {
    var c = root.TopoLab.byId(id);
    if (!c) { labOpen(DEFAULT_SEED); return; }
    labState.seed = DEFAULT_SEED;
    labState.c = c;
    labState.cause = null;
    labState.fix = null;
  }

  function labPhase() {
    if (labState.fix !== null) return 'result';
    if (labState.cause !== null) return 'fix';
    return 'cause';
  }

  function viewLab() {
    if (!labState.c) labOpen(DEFAULT_SEED);
    var c = labState.c;
    var tabs = c.symptom.map(function (t, i) {
      return '<button class="ttab' + (i === 0 ? ' on' : '') + '" data-tab="' + i + '">' + t.name + '</button>';
    }).join('');
    var panes = c.symptom.map(function (t, i) {
      return '<div class="term' + (i === 0 ? ' on' : '') + '" data-pane="' + i + '">' +
        '<pre class="tpre tpre-wrap">' + esc(t.text) + '</pre></div>';
    }).join('');

    /* 终端要认这一关：给它一个假的 view，现场来自案卷 */
    view = {
      lab: true,
      mod: { id: 'X2', title: '故障注入台' },
      stage: { key: c.id, title: c.title },
      scen: { world: c.world },
      mode: 'lab', world: null
    };

    var monNote = c.view === 'mon'
      ? '<div class="note">本卷的证据在<b>带外与监控</b>里：<code>ipmitool sdr</code>、' +
      '<code>ipmitool sel list</code>、<code>prom query</code>、<code>bill report</code>。主机 shell 看不到这些。</div>'
      : '<div class="note">现象只给到"用户看到的那一层"，剩下的要自己查。</div>';

    return '<div class="page lab-page">' +
      '<div class="crumb"><a href="#/">地图</a> / 故障注入台</div>' +
      '<div class="mod-head"><div>' +
      '<div class="mod-id">X2 · 案卷 ' + c.id + ' · ' + c.plane + '</div>' +
      '<h1 class="ph">' + c.title + '</h1>' +
      '<p class="ps">先看现象，再开终端取证，最后给根因和处置。<br>' +
      '根因错得 0 分；根因对但处置错，只能拿半分——查得出来和修得对，是两种能力。</p>' +
      '</div><div class="mod-side">' +
      '<span class="ab-kpi">已破 <b id="lab-solved">' + labSolved() + '</b> / ' + root.TopoLab.count + '</span>' +
      '<button class="btn" id="btn-lab-term">' + (c.view === 'mon' ? '取证终端（带外 + 监控）' : '取证终端') + '</button>' +
      '<button class="btn ghost" id="btn-lab-new">换一个案子</button>' +
      '</div></div>' +
      '<div class="work">' +
      '<section class="panel p-left"><div class="ttabs">' + tabs + '</div>' + panes +
      monNote + '</section>' +
      '<section class="panel p-mid"><div id="lab-q"></div></section>' +
      '<aside class="panel p-right" id="lab-side"></aside>' +
      '</div>' +
      '<div class="bar">' +
      '<button class="btn primary" id="btn-lab-submit">提交</button>' +
      '<span class="lab-step" id="lab-step"></span>' +
      '</div>' +
      '<div id="feedback"></div>' +
      '<div id="extra"></div>' +
      '</div>';
  }

  function paintLabSide(c) {
    var box = $('#lab-side');
    if (!box) return;
    var phase = labPhase();
    var stepTxt = phase === 'cause' ? '第 1 步 / 共 2 步 · 定根因'
      : phase === 'fix' ? '第 2 步 / 共 2 步 · 选处置'
        : '已结算';
    var el = $('#lab-step');
    if (el) el.textContent = stepTxt;

    if (phase !== 'result') {
      box.innerHTML = '<div class="side-h">这一关怎么过</div>' +
        '<div class="steps"><div>1 看现象，先判断是哪一层出事</div>' +
        '<div>2 开终端敲 1~2 条命令确认</div>' +
        '<div>3 选根因，再选处置</div></div>' +
        '<div class="mx-note">证据都在终端里。没查到就直接选，多半会中干扰项。</div>';
      return;
    }
    box.innerHTML = '<div class="side-h">证据链</div>' +
      c.chain.map(function (x) {
        return '<div class="lab-chain"><code>' + x.cmd + '</code><span>' + x.why + '</span></div>';
      }).join('') +
      '<div class="mx-note">这条链是从"现象"走到"根因"的最短路径，下次遇到同类问题照这个顺序查。</div>';
  }

  function mountLab() {
    var box = $('#lab-q');
    if (!box || !labState.c) return;
    var c = labState.c;
    var phase = labPhase();
    var submitBtn = $('#btn-lab-submit');
    if (submitBtn) submitBtn.style.display = phase === 'result' ? 'none' : '';
    if (phase === 'result') {
      box.innerHTML = '<div class="lab-result"><div class="lab-ok">本案已破</div>' +
        '<div class="lab-rt">' + c.title + '</div>' +
        '<div class="lab-rx">根因：' + c.cause.options[c.cause.answer][1].replace(/^正确。/, '') + '</div>' +
        '<div class="lab-rx">处置：' + c.fix.options[c.fix.answer][0] + '</div>' +
        '<button class="btn ghost" id="btn-lab-new2">再来一个</button></div>';
      paintLabSide(c);
      return;
    }
    var qs = phase === 'cause' ? c.cause : c.fix;
    box.innerHTML = (phase === 'fix' ? '<div class="lab-ok">根因已确认</div>' : '') +
      '<div class="lab-qt">' + qs.q + '</div><div id="lab-opts"></div>';
    labState.ctrl = root.TopoRenderChoice.mount($('#lab-opts'), {
      options: qs.options.map(function (o) { return { label: o[0], why: o[1] }; }),
      onPick: function () { }
    });
    paintLabSide(c);
  }

  function submitLab() {
    var c = labState.c;
    if (!c) return;
    if (labPhase() === 'result') { toast('本案已结算，换一个案子继续'); return; }
    if (!labState.ctrl) return;
    var pick = labState.ctrl.answer().pick;
    if (pick === null || pick === undefined) { toast('先选一个'); return; }
    var phase = labPhase();
    var res;
    if (phase === 'cause') {
      res = root.TopoLab.judge(c, { cause: pick, fix: null });
      if (res.ok || res.stage === 'pending') {
        labState.cause = pick;
        renderFeedback({ ok: false, head: '根因确认：' + c.cause.options[pick][0], items: [{ tone: 'info', title: '下一步', text: '现在选处置。注意：查得出来不等于修得对。' }] });
        mountLab();
        return;
      }
      renderFeedback(res);
      PROG.record('X2', c.id, false, { score: 0, tag: 'lab' });
      return;
    }
    res = root.TopoLab.judge(c, { cause: labState.cause, fix: pick });
    if (res.ok) {
      labState.fix = pick;
      renderFeedback(res);
      PROG.record('X2', c.id, true, { score: 1, tag: 'lab' });
      mountLab();
      unlockLab(c);
      var solved = $('#lab-solved');
      if (solved) solved.textContent = labSolved();
      return;
    }
    renderFeedback(res);
    PROG.record('X2', c.id, false, { score: res.score, tag: 'lab' });
  }

  function unlockLab(c) {
    var extra = $('#extra');
    if (!extra || extra.dataset.done) return;
    extra.dataset.done = '1';
    extra.innerHTML = '<div class="kn"><div class="kn-h">案卷笔记 · ' + c.id + '</div>' +
      '<div class="kn-sec"><h3>概念</h3><p>' + c.knowledge.concept + '</p></div>' +
      '<div class="kn-sec"><h3>最容易踩的坑</h3><p>' + c.knowledge.pitfall + '</p></div>' +
      '<div class="kn-sec"><h3>复查顺序</h3><ol>' + c.chain.map(function (x) {
        return '<li><code>' + x.cmd + '</code> —— ' + x.why + '</li>';
      }).join('') + '</ol></div></div>';
  }

  /* ---------------- 模块页 ---------------- */

  function currentStage(mod, key) {
    for (var i = 0; i < mod.stages.length; i++) {
      if (mod.stages[i].key === key) return mod.stages[i];
    }
    return mod.stages[0];
  }

  function viewModule(modId, stageKey) {
    var mod = REG.get(modId);
    if (!mod) {
      return '<div class="page"><div class="crumb"><a href="#/">地图</a></div>' +
        '<h1 class="ph">' + modId + ' 还没开工</h1>' +
        '<p class="ps">这个模块在设计表里，但代码还没写。按六步流程走，不铺空壳。</p></div>';
    }
    var stage = currentStage(mod, stageKey);
    var seed = state.seed[stageKeyOf(mod, stage)] || DEFAULT_SEED;
    var scen = stage.generate(seed, { hard: state.hard });
    state.hintLv[stageKeyOf(mod, stage)] = 0;

    var stageTabs = mod.stages.map(function (s) {
      return '<a class="stab' + (s.key === stage.key ? ' on' : '') + '" href="#/' + mod.plane + '/' + mod.id + '/' + s.key + '">' +
        '<span class="atom a-' + s.atom + '">' + s.atom + '</span>' + s.title + '</a>';
    }).join('');

    var pr = stage.prompt(scen);
    var tabs = pr.tabs.map(function (t, i) {
      return '<button class="ttab' + (i === 0 ? ' on' : '') + '" data-tab="' + i + '">' + t.name + '</button>';
    }).join('');
    var panes = pr.tabs.map(function (t, i) {
      /* 只有拓扑矩阵需要等宽不换行（Legend 是它的标志），日志类一律折行更好读 */
      var isMatrix = !t.html && String(t.text).indexOf('Legend:') >= 0;
      var body = t.html ? t.html
        : '<pre class="tpre' + (isMatrix ? '' : ' tpre-wrap') + '">' + esc(t.text) + '</pre>';
      return '<div class="term' + (i === 0 ? ' on' : '') + '" data-pane="' + i + '">' + body + '</div>';
    }).join('');

    view = { mod: mod, stage: stage, scen: scen, seed: seed, mode: null, world: null };
    history = [];
    future = [];

    var extra = '';
    /* 只有真支持两档难度的关卡才显示这个开关，别放一个按了没反应的控件 */
    if (stage.key === 's1' && mod.id === 'M03') {
      extra = '<label class="switch"><input type="checkbox" id="hard"' + (state.hard ? ' checked' : '') + '> 8 卡难版</label>';
    }

    return '<div class="page mod">' +
      '<div class="crumb"><a href="#/">地图</a> / <a href="#/' + mod.plane + '">' + mod.plane + '</a> / ' + mod.id + '</div>' +
      '<div class="mod-head">' +
      '<div><div class="mod-id">' + mod.id + '</div><h1 class="ph">' + mod.title + '</h1>' +
      '<p class="ps">' + mod.subtitle + '</p></div>' +
      '<div class="mod-side">' + extra + '<button class="btn ghost" id="btn-new">换一题</button></div>' +
      '</div>' +
      '<div class="stabs">' + stageTabs + '</div>' +
      '<div class="work">' +
      '<section class="panel p-left"><div class="ttabs">' + tabs + '</div>' + panes +
      '<div class="note">' + pr.note + '</div></section>' +
      '<section class="panel p-mid"><div id="mid"></div></section>' +
      '<aside class="panel p-right" id="side"></aside>' +
      '</div>' +
      '<div class="bar">' +
      '<button class="btn primary" id="btn-submit">提交比对</button>' +
      '<button class="btn" id="btn-hint">提示</button>' +
      '<button class="btn" id="btn-reset">重摆本题</button>' +
      '<button class="btn ghost" id="btn-undo"' + (stage.renderer === 'board' ? '' : ' disabled') + '>撤销</button>' +
      '<button class="btn ghost" id="btn-redo"' + (stage.renderer === 'board' ? '' : ' disabled') + '>重做</button>' +
      '<button class="btn ghost" id="btn-term" title="打开取证终端">终端</button>' +
      (stage.atom === 'B' ? '<span class="term-hint">拿不准就点终端，敲 help 用真机输出取证</span>' : '') +
      '<span class="seed">seed ' + seed + '</span>' +
      '</div>' +
      '<div id="feedback"></div>' +
      '<div id="extra"></div>' +
      '</div>';
  }

  function mountStage() {
    var mid = $('#mid');
    if (!mid || !view) return;
    var stage = view.stage;
    var spec = stage.renderSpec(view.scen);
    var ctx = {};
    Object.keys(spec.ctx).forEach(function (k) { ctx[k] = spec.ctx[k]; });

    if (spec.renderer === 'board') {
      ctx.beforeChange = pushHistory;
      /* 首次渲染发生在 mount 内部，此时 view.ctrl 还没拿到，必须挡一下 */
      ctx.onUpdate = function () { if (view.ctrl) paintSide(); };
      ctx.onChange = function () { };
    }
    if (spec.renderer === 'choice') {
      ctx.onPick = function () { paintSide(); };
    }

    view.mode = spec.renderer;
    view.ctrl = RENDERERS[spec.renderer].mount(mid, ctx);
    paintSide();
  }

  function paintSide() {
    var side = $('#side');
    if (!side || !view) return;
    var ans = view.ctrl && view.ctrl.answer ? view.ctrl.answer() : {};
    side.innerHTML = view.stage.side ? view.stage.side(view.scen, ans) : '';
  }

  function snap() {
    if (!view || view.mode !== 'board') return null;
    return JSON.stringify(view.scen.player);
  }

  function pushHistory() {
    if (view.mode !== 'board') return;
    var s = JSON.stringify(view.scen.player);
    if (history[history.length - 1] === s) return;
    history.push(s);
    if (history.length > 60) history.shift();
    future.length = 0;
  }

  function restore(str) {
    var next = JSON.parse(str);
    applyConfig(view.scen.player, next);
    view.ctrl.refresh(view.scen.player);
    paintSide();
  }

  /* 原地换内容，保证 renderer 手里的 cfg 引用与 scen.player 始终是同一个对象 */
  function applyConfig(target, next) {
    Object.keys(target).forEach(function (k) { delete target[k]; });
    Object.keys(next).forEach(function (k) { target[k] = next[k]; });
  }

  function doUndo() {
    if (view.mode !== 'board') return;
    if (!history.length) { toast('没有可撤销的步骤'); return; }
    future.push(JSON.stringify(view.scen.player));
    restore(history.pop());
  }

  function doRedo() {
    if (view.mode !== 'board') return;
    if (!future.length) { toast('没有可重做的步骤'); return; }
    var target = future.pop();
    history.push(JSON.stringify(view.scen.player));
    restore(target);
  }

  function renderFeedback(res) {
    var box = $('#feedback');
    if (!box) return;
    var items = (res.items || []).map(function (it) {
      return '<li class="fb-item ' + (it.tone || 'info') + '">' +
        '<div class="fb-t">' + it.title + '</div>' +
        (it.text ? '<div class="fb-x">' + it.text + '</div>' : '') + '</li>';
    }).join('');
    box.innerHTML = '<div class="fb ' + (res.ok ? 'ok' : 'bad') + '">' +
      '<div class="fb-head">' + esc(res.head) + '</div>' +
      (items ? '<ul class="fb-list">' + items + '</ul>' : '') + '</div>';
  }

  function unlock(stage) {
    var extra = $('#extra');
    if (!extra || extra.dataset.done) return;
    var mod = view.mod;
    var k = mod.knowledge;
    var quiz = mod.quiz(view.seed);
    state.quiz = { qs: quiz, picked: {} };

    var qHtml = quiz.map(function (q, i) {
      return '<div class="q" data-q="' + i + '"><div class="q-t">' + (i + 1) + '. ' + q.q + '</div>' +
        q.options.map(function (o, j) {
          return '<label class="q-o"><input type="radio" name="q' + i + '" value="' + j + '"><span>' +
            String.fromCharCode(65 + j) + '. ' + o + '</span></label>';
        }).join('') + '</div>';
    }).join('');

    extra.dataset.done = '1';
    extra.innerHTML = '<div class="kn">' +
      '<div class="kn-h">知识卡 · ' + mod.id + ' ' + mod.title + '</div>' +
      '<div class="kn-sec"><h3>是什么</h3><p>' + k.concept + '</p></div>' +
      '<div class="kn-sec"><h3>为什么长这样</h3><p>' + k.why + '</p></div>' +
      '<div class="kn-sec"><h3>三个常见的坑</h3><ol>' + k.pitfalls.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ol></div>' +
      '<div class="kn-sec"><h3>自己验证一次</h3><p class="mono">' + k.verify + '</p></div>' +
      '</div>' +
      '<div class="quiz" id="quiz"><div class="kn-h">过关小测 · ' + quiz.length + ' 题</div>' + qHtml +
      '<button class="btn primary" id="btn-quiz">判卷</button><div id="quiz-res"></div></div>';
  }

  function checkQuiz() {
    var qs = state.quiz.qs;
    var right = 0;
    var detail = [];
    qs.forEach(function (q, i) {
      var picked = document.querySelector('input[name="q' + i + '"]:checked');
      var v = picked ? Number(picked.value) : -1;
      if (v === q.answer) right++;
      detail.push('<div class="qr ' + (v === q.answer ? 'ok' : 'bad') + '">' +
        '<b>' + (i + 1) + '. ' + (v === q.answer ? '对' : '错') + '</b> ' + q.why + '</div>');
    });
    var box = $('#quiz-res');
    box.innerHTML = '<div class="qr-head">答对 ' + right + ' / ' + qs.length + '</div>' + detail.join('');
  }

  function submit() {
    if (!view) return;
    var ans = view.ctrl.answer();
    var res = view.stage.judge(view.scen, ans);
    renderFeedback(res);
    PROG.record(view.mod.id, view.stage.key, res.ok, { score: res.score, tag: view.stage.key });
    if (res.ok) unlock(view.stage);
  }

  /* ---------------- 路由 ---------------- */

  function route() {
    var parts = String(location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    var app = $('#app');
    if (!parts.length) {
      view = null;
      app.innerHTML = viewMap();
      return;
    }
    if (parts[0] === 'lab' && parts.length === 2) {
      view = null;
      labOpenById(parts[1]);
      app.innerHTML = viewLab();
      mountLab();
      $('#feedback').innerHTML = '';
      $('#extra').innerHTML = '';
      delete $('#extra').dataset.done;
      return;
    }
    if (parts.length === 1) {
      view = null;
      if (parts[0] === 'ability') {
        app.innerHTML = viewAbility();
        return;
      }
      if (parts[0] === 'lab') {
        app.innerHTML = viewLab();
        mountLab();
        return;
      }
      app.innerHTML = viewPlane(parts[0]);
      return;
    }
    state.hintLv = {};
    app.innerHTML = viewModule(parts[1], parts[2]);
    if (!view) return;
    mountStage();
    var rec = PROG.stageRecord(view.mod.id, view.stage.key);
    if (rec && rec.ok > 0) unlock(view.stage);
  }

  /* ---------------- 事件 ---------------- */

  /* 终端 DOM 由脚本兜底注入：index.html 里有就不重复建，测试页里没有也能用 */
  function ensureConsoleDom() {
    if (document.getElementById('con')) return;
    var d = document.createElement('div');
    d.className = 'con';
    d.id = 'con';
    d.innerHTML = '<div class="con-head">' +
      '<span class="con-t">取证终端 <em id="con-host">-</em></span>' +
      '<span class="con-hint">help 看命令 · Esc 收起</span>' +
      '<button class="con-x" id="con-close">收起</button>' +
      '</div>' +
      '<div class="con-out" id="con-out"></div>' +
      '<form class="con-in" id="con-form">' +
      '<span class="con-p">$</span>' +
      '<input id="con-cmd" autocomplete="off" spellcheck="false" placeholder="nvidia-smi topo -m">' +
      '<button class="btn ghost" type="submit">执行</button>' +
      '</form>';
    document.body.appendChild(d);
  }

  function bind() {
    ensureConsoleDom();
    document.addEventListener('click', function (e) {
      var mapRow = e.target.closest('.map-row');
      if (mapRow) {
        var key = mapRow.getAttribute('data-plane');
        var plane = REG.planes().filter(function (p) { return p.key === key; })[0];
        var anyOpen = plane.modules.some(function (m) { return m.open; });
        if (!anyOpen) { toast(plane.name + ' 这一层还在排队，没写完不放出来。'); return; }
        location.hash = '#/' + key;
        return;
      }
      var card = e.target.closest('.card');
      if (card) {
        if (card.classList.contains('soon')) { toast('这个模块还没开工。'); return; }
        var cid = card.getAttribute('data-mod');
        var entry = REG.catalogEntry(cid);
        location.hash = '#/' + (entry ? entry.plane : 'L1') + '/' + cid;
        return;
      }
      var tab = e.target.closest('.ttab');
      if (tab) {
        var i = tab.getAttribute('data-tab');
        document.querySelectorAll('.ttab').forEach(function (t) { t.classList.remove('on'); });
        document.querySelectorAll('.term').forEach(function (p) { p.classList.remove('on'); });
        tab.classList.add('on');
        var pane = document.querySelector('.term[data-pane="' + i + '"]');
        if (pane) pane.classList.add('on');
        return;
      }
      if (e.target.id === 'btn-submit') { submit(); return; }
      if (e.target.id === 'btn-hint') {
        var lv = state.hintLv[stageKeyOf(view.mod, view.stage)] || 0;
        var text = view.stage.hint(view.scen, view.ctrl.answer(), lv);
        state.hintLv[stageKeyOf(view.mod, view.stage)] = Math.min(lv + 1, 2);
        renderFeedback({ ok: false, head: '提示', items: [{ tone: 'warn', title: '第 ' + (lv + 1) + ' 层提示', text: text }] });
        return;
      }
      if (e.target.id === 'btn-reset') {
        if (view.stage.key === 's1') {
          pushHistory();
          applyConfig(view.scen.player, root.TopoModel.blankConfig(view.scen.machine));
          view.ctrl.refresh(view.scen.player);
          paintSide();
          $('#feedback').innerHTML = '';
          toast('已清空拼装区');
        } else {
          toast('这一关没有可重置的状态，直接改答案即可');
        }
        return;
      }
      if (e.target.id === 'btn-undo') { doUndo(); return; }
      if (e.target.id === 'btn-redo') { doRedo(); return; }
      if (e.target.id === 'btn-new') {
        var s = Math.floor(Math.random() * 900000) + 1000;
        state.seed[stageKeyOf(view.mod, view.stage)] = s;
        state.hintLv[stageKeyOf(view.mod, view.stage)] = 0;
        route();
        return;
      }
      if (e.target.id === 'btn-quiz') { checkQuiz(); return; }
      if (e.target.id === 'btn-term') { openConsole(); return; }
      if (e.target.id === 'btn-lab-submit') { submitLab(); return; }
      if (e.target.id === 'btn-lab-term') { openConsole(); return; }
      if (e.target.id === 'btn-lab-new' || e.target.id === 'btn-lab-new2') {
        labOpen(Math.floor(Math.random() * 900000) + 1000);
        $('#feedback').innerHTML = '';
        $('#extra').innerHTML = '';
        delete $('#extra').dataset.done;
        /* 深链进来看的案子，换一个时要先把 hash 退回 #/lab，否则路由又拉回原来那卷 */
        if (location.hash.indexOf('#/lab/') === 0) location.hash = '#/lab';
        else route();
        return;
      }
      if (e.target.id === 'btn-reset-progress') {
        if (e.target.dataset.armed) { PROG.reset(); toast('已清空本机记录'); route(); }
        else { e.target.dataset.armed = '1'; e.target.textContent = '再点一次确认清空'; }
        return;
      }
      if (e.target.id === 'con-close') { closeConsole(); return; }
    });

    document.addEventListener('change', function (e) {
      if (e.target.id === 'hard') {
        state.hard = e.target.checked;
        state.seed[stageKeyOf(view.mod, view.stage)] = DEFAULT_SEED;
        route();
      }
    });

    var conForm = $('#con-form');
    if (conForm) {
      conForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var input = $('#con-cmd');
        var cmd = input.value;
        input.value = '';
        runConsole(cmd);
      });
    }

    var conInput = $('#con-cmd');
    if (conInput) {
      conInput.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (!conHistory.length) return;
          conHistoryAt = Math.max(0, conHistoryAt - 1);
          conInput.value = conHistory[conHistoryAt] || '';
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          conHistoryAt = Math.min(conHistory.length, conHistoryAt + 1);
          conInput.value = conHistory[conHistoryAt] || '';
        }
      });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeConsole();
      if (!view) return;
      var meta = e.ctrlKey || e.metaKey;
      if (meta && e.key === 'z') { e.preventDefault(); doUndo(); }
      if (meta && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); doRedo(); }
      if (e.key === 'Enter' && (e.target.tagName === 'INPUT' && e.target.classList.contains('calc-i'))) {
        e.preventDefault();
        submit();
      }
    });

    window.addEventListener('hashchange', route);
  }

  /* ---------------- X1 取证终端 ---------------- */

  var conHistory = [];
  var conHistoryAt = -1;

  function conEl(id) { return document.getElementById(id); }

  function openConsole() {
    var con = conEl('con');
    if (!con) return;
    con.classList.add('on');
    syncConsole();
    var input = conEl('con-cmd');
    if (input) input.focus();
  }

  function closeConsole() {
    var con = conEl('con');
    if (con) con.classList.remove('on');
  }

  /* 换关就换现场：同一关反复打开保持历史 */
  function syncConsole() {
    if (!view) return;
    var key = view.mod.id + ':' + view.stage.key;
    var con = conEl('con');
    if (!con) return;
    if (con.dataset.key === key) return;
    con.dataset.key = key;
    if (!view.world) view.world = root.TopoConsole.worldFor(view.scen);
    var host = conEl('con-host');
    if (host) host.textContent = (view.mod.id + ' · ' + view.stage.title);
    var out = conEl('con-out');
    if (out) {
      out.innerHTML = '';
      conPrint(root.TopoConsole.banner(view.world), 'con-note');
    }
    conHistory = [];
    conHistoryAt = -1;
  }

  function conPrint(text, cls) {
    var out = conEl('con-out');
    if (!out) return;
    var div = document.createElement('div');
    div.className = 'con-block ' + (cls || '');
    div.textContent = text;
    out.appendChild(div);
    out.scrollTop = out.scrollHeight;
  }

  function runConsole(cmd) {
    if (!view) return;
    syncConsole();
    var raw = String(cmd || '').trim();
    if (!raw) return;
    conHistory.push(raw);
    conHistoryAt = conHistory.length;
    conPrint('$ ' + raw, 'con-echo');
    if (!view.world) view.world = root.TopoConsole.worldFor(view.scen);
    var res = root.TopoConsole.exec(raw, view.world);
    if (res.clear) {
      var out = conEl('con-out');
      if (out) out.innerHTML = '';
      return;
    }
    if (res.text) conPrint(res.text);
  }

  function boot() {
    bind();
    if (!location.hash) location.hash = '#/';
    route();
    window.__campus = { state: state, view: function () { return view; }, route: route, lab: function () { return labState; } };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
