apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: demo-app
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - {name: apps-wildcard-tls, namespace: cert-manager}
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: demo-redirect, namespace: demo-app}
spec:
  parentRefs: [{name: eg, sectionName: http}]
  hostnames: ["demo.apps.k8s.local"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 301}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: demo, namespace: demo-app}
spec:
  parentRefs: [{name: eg, sectionName: https}]
  hostnames: ["demo.apps.k8s.local"]
  rules:
    - backendRefs: [{name: web, port: 80}]
