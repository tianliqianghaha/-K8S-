  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: 172.23.163.111:9000
      accessKeyId: "k8s-8c7b5e76417f"
      secretAccessKey: "St15o7mc1wfGQsZd3oZEvpNbRKHvyK4j"
