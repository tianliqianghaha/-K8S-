apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels: {app.kubernetes.io/part-of: demo}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marker
  namespace: demo-app
data:
  who: k8s20
  managed-by: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo-app
  labels: {app: web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.45
          command: ["/agnhost", "netexec", "--http-port=8080"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo-app
spec:
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: 8080}]
