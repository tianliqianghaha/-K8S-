apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: skip-platform-namespaces
      expression: "!(request.namespace in ['kube-system','kube-public','kube-node-lease','vpa','keda','kyverno','longhorn-system','monitoring','argocd','argo','argo-rollouts','kueue-system','velero','loki','gateway-system'])"
  validations:
    - expression: "object.spec.containers.all(c, !c.image.endsWith(':latest'))"
      message: "禁止使用 :latest 标签"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: skip-platform-namespaces
      expression: "!(request.namespace in ['kube-system','kube-public','kube-node-lease','vpa','keda','kyverno','longhorn-system','monitoring','argocd','argo','argo-rollouts','kueue-system','velero','loki','gateway-system'])"
  validations:
    - expression: "object.spec.containers.all(c, has(c.resources) && has(c.resources.requests) && has(c.resources.limits))"
      message: "必须声明 requests 与 limits"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: skip-platform-namespaces
      expression: "!(request.namespace in ['kube-system','kube-public','kube-node-lease','vpa','keda','kyverno','longhorn-system','monitoring','argocd','argo','argo-rollouts','kueue-system','velero','loki','gateway-system'])"
  validations:
    - expression: "object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)"
      message: "禁止 privileged 容器"
