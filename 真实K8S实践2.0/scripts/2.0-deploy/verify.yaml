apiVersion: v1
kind: Namespace
metadata:
  name: verify
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: verify
spec:
  replicas: 2
  selector:
    matchLabels: {app: probe}
  template:
    metadata:
      labels: {app: probe}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: probe}
      containers:
        - name: nginx
          image: registry.k8s.io/e2e-test-images/agnhost:2.45
          command: ["/agnhost", "netexec", "--http-port=8080"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: verify
spec:
  selector: {app: probe}
  ports: [{name: http, port: 80, targetPort: 8080}]
