# 第 9 章 · 存储快照与备份策略（Longhorn RecurringJob）
# 说明：1.13 用 RecurringJob CRD，卷需带 recurring-job-group 标签才会被纳入
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  name: daily-snapshot
  cron: "0 2 * * *"
  task: snapshot
  groups:
    - default
  retain: 3
  concurrency: 2
  labels:
    policy: daily
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
spec:
  name: weekly-backup
  cron: "0 3 * * 0"
  task: backup
  groups:
    - default
  retain: 2
  concurrency: 1
  labels:
    policy: weekly
