# 第 8 章 · 黑盒探针（从集群内看"用户视角"是否可用）
# 说明：Probe 必须带 label release=kps 才会被 kube-prometheus-stack 的 Prometheus 选中
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: gateway-https
  namespace: monitoring
  labels:
    release: kps
    tier: edge
spec:
  jobName: gateway-https
  interval: 30s
  scrapeTimeout: 10s
  module: https_internal_ca
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - https://demo.apps.k8s.local:32691/
      labels:
        target_name: gateway-https
        namespaces: apps
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: gateway-http
  namespace: monitoring
  labels:
    release: kps
    tier: edge
spec:
  jobName: gateway-http
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://demo.apps.k8s.local:31559/
      labels:
        target_name: gateway-http
        expect: "301"
---
apiVersion: monitoring.coreos.com/v1
