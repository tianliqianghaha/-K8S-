<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ui all</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script src="../src/core/rng.js"></script>
<script src="../src/core/model.js"></script>
<script src="../src/core/place.js"></script>
<script src="../src/core/grade.js"></script>
<script src="../src/core/factory.js"></script>
<script src="../src/core/registry.js"></script>
<script src="../src/core/progress.js"></script>
<script src="../src/core/console.js"></script>
<script src="../src/core/lab.js"></script>
<script src="../src/core/ability.js"></script>
<script src="../src/renderers/matrix.js"></script>
<script src="../src/renderers/board.js"></script>
<script src="../src/renderers/calc.js"></script>
<script src="../src/renderers/choice.js"></script>
<script src="../src/renderers/sort.js"></script>
<script src="../src/renderers/match.js"></script>
<script src="../src/domains/L0/m00_m01.js"></script>
<script src="../src/domains/L1/m02_m04_m05.js"></script>
<script src="../src/domains/L1/m03_pcie.js"></script>
<script src="../src/domains/L2/m06_m09.js"></script>
<script src="../src/domains/L3/m10_m14.js"></script>
<script src="../src/domains/L4/m15_m19.js"></script>
<script src="../src/domains/L5/m20_m24.js"></script>
<script src="../src/domains/L6/m25_m27.js"></script>
<script src="../src/shell/app.js"></script>

<script>
(function () {
  var out = [];
  var fails = 0;
  function ok(name, cond, extra) {
    if (!cond) { fails++; out.push('FAIL ' + name + ' :: ' + (extra || '')); }
    else out.push('PASS ' + name);
  }
  function q(s) { return document.querySelector(s); }
  function qa(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }

  function clickPart(id) {
    var el = q('.bd-part[data-part="' + id + '"]') || q('.bd-trayitem[data-part="' + id + '"]');
    if (!el) throw new Error('找不到零件 ' + id);
    el.click();
  }
  function clickZone(t) {
    var sel = t.kind === 'cpu' ? '[data-zone="cpu"][data-numa="' + t.numa + '"]'
      : t.kind === 'bridges' ? '[data-zone="bridges"][data-cpu="' + t.cpu + '"]'
        : '[data-zone="under"][data-host="' + t.host + '"]';
    var z = q(sel);
    if (!z) throw new Error('找不到框 ' + sel);
    z.click();
  }
  function cur(p, id) {
    if (Object.prototype.hasOwnProperty.call(p.cpuPlacement, id)) return { kind: 'cpu', numa: p.cpuPlacement[id] };
    if (Object.prototype.hasOwnProperty.call(p.bridges, id)) return { kind: 'bridges', cpu: p.bridges[id] };
    if (Object.prototype.hasOwnProperty.call(p.switches, id)) return { kind: 'under', host: p.switches[id] };
    if (p.devices[id]) return { kind: 'under', host: p.devices[id].parent };
    return { kind: 'tray' };
  }
  function place(partId, t) {
    var p = window.__campus.view().scen.player;
    var c = cur(p, partId);
    if (c.kind === t.kind && c.numa === t.numa && c.cpu === t.cpu && c.host === t.host) return;
    clickPart(partId);
    clickZone(t);
  }
  function depthOf(m, s) { var d = 0, p = m.switches[s]; while (p && m.switches[p]) { d++; p = m.switches[p]; } return d; }

  function solveBoard() {
    var m = window.__campus.view().scen.machine;
    Object.keys(m.cpuPlacement).forEach(function (c) { place(c, { kind: 'cpu', numa: m.cpuPlacement[c] }); });
    Object.keys(m.bridges).forEach(function (b) { place(b, { kind: 'bridges', cpu: m.bridges[b] }); });
    Object.keys(m.switches).sort(function (a, b) { return depthOf(m, a) - depthOf(m, b); })
      .forEach(function (s) { place(s, { kind: 'under', host: m.switches[s] }); });
    Object.keys(m.devices).forEach(function (d) { place(d, { kind: 'under', host: m.devices[d].parent }); });
  }

  function solveSort(correct) {
    for (var i = 0; i < correct.length; i++) {
      var ids = qa('.st-row').map(function (r) { return r.getAttribute('data-id'); });
      if (ids[i] === correct[i]) continue;
      var j = ids.indexOf(correct[i]);
      if (j < 0) throw new Error('排序里找不到 ' + correct[i]);
      qa('.st-row')[i].click();
      qa('.st-row')[j].click();
    }
  }

  function solveMatch(pairs) {
    Object.keys(pairs).forEach(function (l) {
      var lEl = q('.mt-left[data-id="' + l + '"]');
      if (!lEl) throw new Error('配对元素缺失 ' + l);
      lEl.click();
      /* 点完左边会重渲染，右边必须重新查，否则点的是已经脱离文档的旧节点 */
      var rEl = q('.mt-right[data-id="' + pairs[l] + '"]');
      if (!rEl) throw new Error('配对右项缺失 ' + pairs[l]);
      rEl.click();
    });
  }

  function solveCurrent() {
    var v = window.__campus.view();
    var s = v.stage, scen = v.scen;
    if (s.renderer === 'board') {
      solveBoard();
    } else if (s.renderer === 'calc') {
      var d = scen.digits === undefined ? 1 : scen.digits;
      var input = q('.calc-i');
      if (!input) throw new Error('没有输入框');
      input.value = scen.expected.toFixed(d);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    } else if (s.renderer === 'choice') {
      var item = qa('.ch-item')[scen.answer];
      if (!item) throw new Error('没有选项');
      item.click();
    } else if (s.renderer === 'sort') {
      solveSort(scen.correct);
    } else if (s.renderer === 'match') {
      solveMatch(scen.pairs);
    }
  }

  function firstFail(fb) {
    var t = fb ? fb.textContent.replace(/\s+/g, ' ').slice(0, 90) : 'no feedback';
    return t;
  }

  function runCon(cmd) {
    var i = q('#con-cmd');
    if (!i) throw new Error('终端没打开');
    i.value = cmd;
    q('#con-form').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    return q('#con-out').textContent;
  }

  window.addEventListener('load', function () {
    var steps = [];
    var REG = window.TopoRegistry;

    /* 每次跑都从零开始，否则上一次的进度会污染"85/85"这类断言 */
    steps.push(function () {
      TopoProgress.reset();
      location.hash = '#/';
    });
    steps.push(function () {
      ok('地图页 7 个平面', qa('.map-row').length === 7, qa('.map-row').length);
      ok('28 个模块全部可进入', qa('.map-row.live').length === 7, qa('.map-row.live').length);
    });

    REG.CATALOG.forEach(function (entry) {
      var m = REG.get(entry.id);
      steps.push(function () { location.hash = '#/' + entry.plane + '/' + entry.id + '/' + m.stages[0].key; });
      steps.push(function () {
        ok(entry.id + ' 标题渲染', !!q('.mod-head') && document.body.textContent.indexOf(m.title) >= 0);
        ok(entry.id + ' 关卡页签数 = ' + m.stages.length, qa('.stab').length === m.stages.length, qa('.stab').length);
      });

      m.stages.forEach(function (s) {
        steps.push(function () {
          var v = window.__campus.view();
          if (!v || v.stage.key !== s.key) { location.hash = '#/' + entry.plane + '/' + entry.id + '/' + s.key; return; }
        });
        steps.push(function () {
          var v = window.__campus.view();
          if (!v || v.stage.key !== s.key) { ok(entry.id + '/' + s.key + ' 未进入', false); return; }
          try {
            ok(entry.id + '/' + s.key + ' 题面非空', qa('.term.on').length === 1);
            ok(entry.id + '/' + s.key + ' 操作区有内容', q('#mid').children.length > 0);
            solveCurrent();
            q('#btn-submit').click();
            var fb = q('#feedback .fb');
            ok(entry.id + '/' + s.key + ' 点击解出后判过', !!(fb && fb.className.indexOf('ok') >= 0), firstFail(fb));
          } catch (e) {
            ok(entry.id + '/' + s.key + ' 交互异常', false, e.message);
          }
        });
      });
    });

    /* 全部 24 卷都要能深链打开，且 L0/L5 的取证路径提示与普通卷不同 */
    window.TopoLab.CASES.forEach(function (c) {
      steps.push(function () { location.hash = '#/lab/' + c.id; });
      steps.push(function () {
        var st = window.__campus.lab();
        ok('案卷 ' + c.id + ' 深链打开', !!(st && st.c && st.c.id === c.id), st && st.c ? st.c.id : 'none');
        ok('案卷 ' + c.id + ' 四个根因选项', qa('#lab-opts .ch-item').length === 4, qa('#lab-opts .ch-item').length);
        var note = q('.p-left .note') ? q('.p-left .note').textContent : '';
        ok('案卷 ' + c.id + ' 取证路径提示正确',
          c.view === 'mon' ? note.indexOf('带外与监控') >= 0 : note.indexOf('用户看到的那一层') >= 0,
          note.replace(/\s+/g, ' ').slice(0, 40));
      });
    });

    steps.push(function () { location.hash = '#/lab/F23'; });

    steps.push(function () {
      q('#btn-lab-term').click();
      var out = runCon('bill report --team nlp');
      ok('L5 案卷的账单能在终端查到', out.indexOf('¥516,096') >= 0);
      var out2 = runCon("prom query 'gpu_util_pct'");
      ok('L5 案卷的监控指标能在终端查到', out2.indexOf('prom query') >= 0 && out2.indexOf('=>') >= 0);
      q('#con-close').click();
    });

    steps.push(function () { location.hash = '#/lab'; });

    steps.push(function () {
      ok('故障注入台打开', !!q('#lab-q') && !!q('#lab-opts'));
      var st = window.__campus.lab();
      ok('拿到案卷', !!(st && st.c), st && st.c ? st.c.id : 'none');
      var wrong = (st.c.cause.answer + 1) % st.c.cause.options.length;
      qa('#lab-opts .ch-item')[wrong].click();
      q('#btn-lab-submit').click();
    });

    steps.push(function () {
      var fb = q('#feedback .fb');
      ok('根因选错被判错', fb && fb.className.indexOf('bad') >= 0);
      var st = window.__campus.lab();
      qa('#lab-opts .ch-item')[st.c.cause.answer].click();
      q('#btn-lab-submit').click();
    });

    steps.push(function () {
      ok('根因对了才进入处置', !!q('#lab-q .lab-ok'));
      var st = window.__campus.lab();
      var items = qa('#lab-opts .ch-item');
      ok('处置选项 3 个', items.length === 3, '实际 ' + items.length);
      items[st.c.fix.answer].click();
      q('#btn-lab-submit').click();
    });

    steps.push(function () {
      var fb = q('#feedback .fb');
      ok('处置对了结算通过', fb && fb.className.indexOf('ok') >= 0, fb ? fb.textContent.slice(0, 50) : 'none');
      ok('结算后给出证据链', q('#lab-side').textContent.indexOf('证据链') >= 0);
      ok('解锁案卷笔记', document.body.textContent.indexOf('案卷笔记') >= 0);
      var kpi = q('.ab-kpi');
      ok('已破计数变成 1 / ' + window.TopoLab.count,
        kpi && kpi.textContent.replace(/\s/g, '').indexOf('1/' + window.TopoLab.count) >= 0,
        kpi ? kpi.textContent : 'none');
    });

    steps.push(function () { location.hash = '#/ability'; });

    steps.push(function () {
      var kpi = document.querySelector('.ab-kpi');
      ok('跑完 85 关后雷达页可打开', !!document.querySelector('svg.radar'));
      ok('通关数显示 85 / 85',
        kpi && kpi.textContent.replace(/\s/g, '').indexOf('85/85') >= 0,
        kpi ? kpi.textContent : 'no kpi');
      ok('七个平面都有掌握度', qa('.ab-row').length === 7);
      ok('全部通关后建议复练', document.body.textContent.indexOf('一次过率') >= 0);
      ok('没有失败记录时不显示错题本', qa('.ab-w').length === 0, 'wrong=' + qa('.ab-w').length + ' idx=' + document.body.textContent.indexOf('最近没过的关'));
    });

    var i = 0;
    (function next() {
      if (i >= steps.length) {
        var pre = document.createElement('pre');
        pre.id = 'RESULT';
        pre.textContent = '\n@@BEGIN@@\n' + out.join('\n') + '\n@@END@@\n' + (fails ? 'TOTAL FAIL ' + fails : 'TOTAL PASS ' + out.length);
        document.body.appendChild(pre);
        document.title = fails ? 'FAIL' : 'OK';
        return;
      }
      var fn = steps[i++];
      try { fn(); } catch (e) { ok('步骤异常', false, e && e.message); }
      setTimeout(next, 25);
    })();
  });
})();
</script>
</body>
</html>
